services:
  # Backend API Service
  - type: web
    name: capm-gordon-api
    runtime: python3
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements_tradingview.txt
    startCommand: python backend_tradingview.py
    envVars:
      - key: PORT
        value: 5000
    autoDeploy: true
