services:
  - type: web
    name: capm-gordon-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements_tradingview.txt
    startCommand: gunicorn backend_tradingview:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
    autoDeploy: true
