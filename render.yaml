services:
  # Backend API Service
  - type: web
    name: capm-gordon-api
    runtime: python3
    buildCommand: pip install -r requirements_tradingview.txt
    startCommand: python backend_tradingview.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: PORT
        value: 5000
    autoDeploy: true
