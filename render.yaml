services:
  # Backend API Service
  - type: web
    name: capm-gordon-api
    runtime: python
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements_tradingview.txt
    startCommand: gunicorn backend_tradingview:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
    autoDeploy: true
