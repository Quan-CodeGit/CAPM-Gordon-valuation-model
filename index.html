<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CAPM & Gordon Model — Stock Valuation Terminal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://va.vercel-scripts.com/v1/script.debug.js"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --bg: #030508;
            --card-bg: rgba(12, 14, 28, 0.92);
            --card-border: rgba(140,100,255,0.22);
            --card-border-bright: rgba(170,130,255,0.45);
            --bull: #10f07a;
            --bull-glow: rgba(16, 240, 122, 0.22);
            --bear: #ff4060;
            --bear-glow: rgba(255, 64, 96, 0.22);
            --blue: #5eadff;
            --blue-glow: rgba(94, 173, 255, 0.15);
            --gold: #ffc445;
            --purple: #c084fc;
            --cosmic: #a78bfa;
            --text-primary: #f0f4ff;
            --text-secondary: #8fa3c0;
            --text-dim: #3d4a6a;
            --mono: 'DM Mono', monospace;
            --sans: 'Sora', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ── Star canvas layer ─────────────────────────── */
        #star-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Galaxy nebula ─────────────────────────────── */
        #nebula {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 70% 55% at 15% 20%, rgba(120,60,255,0.09) 0%, transparent 60%),
                radial-gradient(ellipse 55% 60% at 88% 78%, rgba(255,64,96,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 55% 5%,  rgba(60,130,255,0.07) 0%, transparent 58%),
                radial-gradient(ellipse 40% 50% at 78% 30%, rgba(180,80,255,0.06) 0%, transparent 55%),
                radial-gradient(ellipse 60% 35% at 30% 80%, rgba(16,200,180,0.04) 0%, transparent 55%);
            animation: nebula-drift 30s ease-in-out infinite alternate;
        }
        #nebula-pulse {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse 40% 40% at 50% 50%, rgba(100,60,200,0.03) 0%, transparent 70%);
            animation: nebula-pulse 8s ease-in-out infinite alternate;
        }
        @keyframes nebula-drift {
            0%   { opacity: 0.65; transform: scale(1)    translateY(0); }
            100% { opacity: 1;    transform: scale(1.07) translateY(-18px); }
        }
        @keyframes nebula-pulse {
            0%   { opacity: 0.4; transform: scale(0.95); }
            100% { opacity: 1;   transform: scale(1.08); }
        }

        /* ── App wrapper ───────────────────────────────── */
        #app { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 16px 14px 56px; }

        /* ── Cards ─────────────────────────────────────── */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-shadow: 0 2px 20px rgba(0,0,0,0.55), inset 0 1px 0 rgba(160,120,255,0.1);
        }
        .card::before {
            content: '';
            position: absolute; top: 0; left: 5%; right: 5%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(180,140,255,0.5), rgba(120,190,255,0.3), transparent);
            pointer-events: none;
        }
        .card:hover {
            border-color: var(--card-border-bright);
            box-shadow: 0 0 32px rgba(120,80,255,0.14), 0 4px 28px rgba(0,0,0,0.55), inset 0 1px 0 rgba(180,140,255,0.18);
        }

        /* ── Section label ─────────────────────────────── */
        .section-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-weight: 600;
        }

        /* ── Verdict banner ────────────────────────────── */
        .verdict {
            border-radius: 16px;
            padding: 28px 28px 24px;
            position: relative; overflow: hidden;
            animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }
        .verdict-bull {
            background: linear-gradient(135deg, rgba(16,240,122,0.15) 0%, rgba(8,14,28,0.97) 55%);
            border: 1px solid rgba(16,240,122,0.45);
            box-shadow: 0 0 60px rgba(16,240,122,0.15), 0 0 120px rgba(16,240,122,0.07), inset 0 1px 0 rgba(16,240,122,0.3), 0 4px 24px rgba(0,0,0,0.6);
        }
        .verdict-bear {
            background: linear-gradient(135deg, rgba(255,64,96,0.15) 0%, rgba(8,14,28,0.97) 55%);
            border: 1px solid rgba(255,64,96,0.45);
            box-shadow: 0 0 60px rgba(255,64,96,0.15), 0 0 120px rgba(255,64,96,0.07), inset 0 1px 0 rgba(255,64,96,0.3), 0 4px 24px rgba(0,0,0,0.6);
        }
        .verdict::after {
            content: '';
            position: absolute; top: -60px; right: -60px;
            width: 200px; height: 200px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ── Text ──────────────────────────────────────── */
        .text-bull  { color: var(--bull); }
        .text-bear  { color: var(--bear); }
        .text-blue  { color: var(--blue); }
        .text-gold  { color: var(--gold); }
        .text-purple{ color: var(--purple); }

        .glow-bull { text-shadow: 0 0 24px rgba(16,240,122,0.55); }
        .glow-bear { text-shadow: 0 0 24px rgba(255,64,96,0.55); }

        .num { font-family: var(--mono); }

        /* ── Animations ────────────────────────────────── */
        @keyframes fadeUp {
            from { opacity:0; transform: translateY(22px); }
            to   { opacity:1; transform: translateY(0); }
        }
        @keyframes fadeLeft {
            from { opacity:0; transform: translateX(-36px); }
            to   { opacity:1; transform: translateX(0); }
        }
        @keyframes fadeRight {
            from { opacity:0; transform: translateX(36px); }
            to   { opacity:1; transform: translateX(0); }
        }
        .a0  { animation: fadeUp    0.55s 0.00s cubic-bezier(0.16,1,0.3,1) both; }
        .a1  { animation: fadeUp    0.50s 0.08s cubic-bezier(0.16,1,0.3,1) both; }
        .a2  { animation: fadeUp    0.50s 0.16s cubic-bezier(0.16,1,0.3,1) both; }
        .a3  { animation: fadeUp    0.50s 0.24s cubic-bezier(0.16,1,0.3,1) both; }
        .a4  { animation: fadeUp    0.50s 0.32s cubic-bezier(0.16,1,0.3,1) both; }
        .a5  { animation: fadeUp    0.50s 0.40s cubic-bezier(0.16,1,0.3,1) both; }
        /* Directional card entrances */
        .aL1 { animation: fadeLeft  0.55s 0.08s cubic-bezier(0.16,1,0.3,1) both; }
        .aR2 { animation: fadeRight 0.55s 0.16s cubic-bezier(0.16,1,0.3,1) both; }
        .aL3 { animation: fadeLeft  0.55s 0.24s cubic-bezier(0.16,1,0.3,1) both; }
        .aR3 { animation: fadeRight 0.55s 0.24s cubic-bezier(0.16,1,0.3,1) both; }
        .aL4 { animation: fadeLeft  0.55s 0.32s cubic-bezier(0.16,1,0.3,1) both; }
        .aR4 { animation: fadeRight 0.55s 0.32s cubic-bezier(0.16,1,0.3,1) both; }
        .aL5 { animation: fadeLeft  0.55s 0.40s cubic-bezier(0.16,1,0.3,1) both; }

        /* Bar grow */
        @keyframes barGrow { from { width:0; } }
        .bar-animated { animation: barGrow 0.9s 0.35s cubic-bezier(0.34,1.56,0.64,1) both; }

        /* Candle loader */
        @keyframes ca { 0%,100%{transform:scaleY(0.35)} 50%{transform:scaleY(1)} }
        @keyframes cb { 0%,100%{transform:scaleY(1)}    50%{transform:scaleY(0.3)} }
        @keyframes cc { 0%,33%{transform:scaleY(0.6)}   66%{transform:scaleY(0.28)} 100%{transform:scaleY(0.9)} }
        .ca { animation: ca 1.15s ease-in-out infinite; transform-origin:bottom; }
        .cb { animation: cb 1.0s 0.2s ease-in-out infinite; transform-origin:bottom; }
        .cc { animation: cc 1.1s 0.4s ease-in-out infinite; transform-origin:bottom; }

        /* Pulse dot */
        @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.45;transform:scale(0.75)} }
        .pulse-dot { animation: pulseDot 2.2s ease-in-out infinite; }

        /* ── Inputs ────────────────────────────────────── */
        .ticker-input {
            background: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(255,255,255,0.14);
            border-radius: 10px;
            color: #fff;
            font-family: var(--mono);
            font-size: 1.15rem;
            font-weight: 500;
            letter-spacing: 0.07em;
            outline: none;
            padding: 13px 18px;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .ticker-input:focus {
            border-color: var(--blue);
            background: rgba(94,173,255,0.06);
            box-shadow: 0 0 0 3px rgba(94,173,255,0.12), 0 0 20px rgba(94,173,255,0.08);
        }
        .ticker-input::placeholder { color: var(--text-dim); font-weight: 300; }
        .ticker-input:disabled { opacity: 0.45; cursor: not-allowed; }

        .override-input {
            background: rgba(255,196,69,0.07);
            border: 1.5px solid rgba(255,196,69,0.3);
            border-radius: 8px;
            color: var(--gold);
            font-family: var(--mono);
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            padding: 6px 10px;
            width: 78px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .override-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(255,196,69,0.1);
        }

        /* ── Buttons ───────────────────────────────────── */
        .btn-analyze {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border: none; border-radius: 10px;
            color: #fff;
            font-family: var(--sans);
            font-size: 0.93rem; font-weight: 600;
            padding: 13px 26px;
            cursor: pointer; white-space: nowrap;
            box-shadow: 0 4px 18px rgba(99,102,241,0.35);
            transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
        }
        .btn-analyze:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(99,102,241,0.5);
        }
        .btn-analyze:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }

        .market-btn {
            background: rgba(255,255,255,0.035);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--text-secondary);
            font-family: var(--sans);
            font-size: 0.88rem; font-weight: 500;
            padding: 10px 14px;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px; justify-content: center;
            transition: all 0.18s;
        }
        .market-btn:hover:not(:disabled) { background: rgba(255,255,255,0.07); color: var(--text-primary); border-color: rgba(255,255,255,0.2); }
        .mkt-vn { background: rgba(220,38,38,0.1); border-color: rgba(220,38,38,0.35); color: #fca5a5; }
        .mkt-us { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.35); color: #93c5fd; }
        .mkt-au { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.35); color: #86efac; }

        /* ── Ticker pill ───────────────────────────────── */
        .tkr-pill {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 7px;
            padding: 4px 9px;
            font-family: var(--mono);
            font-size: 0.77rem;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.14s;
        }
        .tkr-pill:hover { background: rgba(255,255,255,0.09); color: #fff; border-color: rgba(255,255,255,0.2); }
        .tkr-sym { color: #fff; font-weight: 500; }

        /* ── Signal bar ────────────────────────────────── */
        .bar-track {
            background: rgba(255,255,255,0.06);
            border-radius: 5px; height: 7px;
            width: 100%; overflow: hidden;
        }

        /* ── Metric chip ───────────────────────────────── */
        .metric-chip {
            background: rgba(16,18,38,0.9);
            border: 1px solid rgba(140,100,255,0.2);
            border-radius: 10px;
            padding: 14px 15px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        .metric-val { font-family: var(--mono); font-size: 1.2rem; font-weight: 500; color: #fff; }

        /* ── Separator ─────────────────────────────────── */
        .sep { border: none; border-top: 1px solid rgba(255,255,255,0.07); margin: 0; }

        /* ── Suggest pill ──────────────────────────────── */
        .suggest-pill {
            background: rgba(192,132,252,0.08);
            border: 1px solid rgba(192,132,252,0.22);
            border-radius: 20px; color: var(--purple);
            font-family: var(--sans); font-size: 0.76rem;
            padding: 4px 12px; cursor: pointer;
            transition: all 0.14s;
        }
        .suggest-pill:hover:not(:disabled) {
            background: rgba(192,132,252,0.16);
            border-color: rgba(192,132,252,0.45); color: #e9d5ff;
        }

        /* ── Data row ──────────────────────────────────── */
        .data-row {
            display: flex; justify-content: space-between; align-items: baseline;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .data-row:last-child { border-bottom: none; }
        .data-key { color: var(--text-secondary); font-size: 0.83rem; }
        .data-val { font-family: var(--mono); font-size: 0.87rem; color: #fff; font-weight: 500; }

        /* ── Info accordion ────────────────────────────── */
        .acc-btn {
            width: 100%; background: none; border: none; cursor: pointer;
            padding: 13px 18px; display: flex; justify-content: space-between; align-items: center;
            color: var(--text-secondary); font-family: var(--sans); font-size: 0.8rem;
        }
        .acc-btn:hover { color: var(--text-primary); }

        /* ── Scrollbar ─────────────────────────────────── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        /* ── Header glow ───────────────────────────────── */
        .header-title {
            font-family: var(--sans); font-weight: 700;
            font-size: clamp(1.6rem, 4vw, 2.3rem);
            background: linear-gradient(135deg, #ffffff 0%, #d4b8ff 30%, #7eb8ff 65%, #b8a0ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.025em; margin: 0 0 8px;
            filter: drop-shadow(0 0 20px rgba(140,100,255,0.3));
        }

        /* ── Warning box ───────────────────────────────── */
        .warn-box {
            background: rgba(255,196,69,0.09);
            border: 1px solid rgba(255,196,69,0.35);
            border-radius: 10px; padding: 12px 16px;
            display: flex; gap: 10px; align-items: flex-start;
            box-shadow: 0 2px 16px rgba(0,0,0,0.4);
        }
        .err-box {
            background: rgba(255,64,96,0.1);
            border: 1px solid rgba(255,64,96,0.4);
            border-radius: 10px; padding: 14px 18px;
            display: flex; gap: 10px; align-items: flex-start;
            box-shadow: 0 2px 16px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

<!-- Galaxy canvas -->
<canvas id="star-canvas"></canvas>
<!-- Nebula layers -->
<div id="nebula"></div>
<div id="nebula-pulse"></div>

<div id="root" style="position:relative;z-index:1;"></div>

<!-- Galaxy field + comet animation -->
<script>
(function() {
    var canvas = document.getElementById('star-canvas');
    var ctx = canvas.getContext('2d');
    var stars = [];
    var comets = [];
    var lastCometMs = 0;
    var COMET_EVERY = 3800;
    var animId;

    // Star tints: mostly cool white-blue, some warm gold, some purple
    var TINTS = ['215,228,255','200,215,255','180,200,255','255,240,200','220,180,255'];

    function buildStars() {
        stars = [];
        var count = Math.min(Math.max(Math.floor((canvas.width * canvas.height) / 4500), 160), 340);
        for (var i = 0; i < count; i++) {
            var r = Math.random();
            var isBright = r > 0.95;
            var isMed    = r > 0.76;
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: isBright ? Math.random() * 1.1 + 1.6
                       : isMed   ? Math.random() * 0.8 + 0.7
                       :           Math.random() * 0.45 + 0.15,
                baseAlpha: isBright ? Math.random() * 0.22 + 0.72
                          : isMed   ? Math.random() * 0.38 + 0.3
                          :           Math.random() * 0.28 + 0.14,
                speed:  Math.random() * 0.007 + 0.002,
                offset: Math.random() * Math.PI * 2,
                glow:   isBright,
                tint:   TINTS[Math.floor(Math.random() * TINTS.length)]
            });
        }
    }

    function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        buildStars();
    }

    function spawnComet() {
        var fromLeft = Math.random() > 0.5;
        // Angle: slight diagonal, mostly horizontal
        var angleDeg = (Math.random() * 18 - 9) + (fromLeft ? 0 : 180);
        var angleRad = angleDeg * Math.PI / 180;
        var speed = 6 + Math.random() * 5;
        comets.push({
            x:       fromLeft ? -100 : canvas.width + 100,
            y:       canvas.height * (0.05 + Math.random() * 0.7),
            vx:      Math.cos(angleRad) * speed,
            vy:      Math.sin(angleRad) * speed,
            tailLen: 100 + Math.random() * 130,
            life:    0,
            maxLife: 80 + Math.random() * 60,
            width:   1.2 + Math.random() * 0.8
        });
    }

    function drawComets() {
        for (var j = comets.length - 1; j >= 0; j--) {
            var c = comets[j];
            c.life++;
            c.x += c.vx;
            c.y += c.vy;
            if (c.life > c.maxLife) { comets.splice(j, 1); continue; }

            var prog = c.life / c.maxLife;
            // Fade in first 15%, hold, fade out last 20%
            var a = prog < 0.15 ? prog / 0.15
                  : prog > 0.80 ? (1 - prog) / 0.20
                  : 1;
            a = Math.min(a * 0.85, 0.85);

            var spd = Math.hypot(c.vx, c.vy);
            var nx  = c.vx / spd;
            var ny  = c.vy / spd;
            var tx  = c.x - nx * c.tailLen;
            var ty  = c.y - ny * c.tailLen;

            var grad = ctx.createLinearGradient(tx, ty, c.x, c.y);
            grad.addColorStop(0,   'rgba(160,140,255,0)');
            grad.addColorStop(0.5, 'rgba(200,180,255,' + (a * 0.35) + ')');
            grad.addColorStop(1,   'rgba(240,235,255,' + a + ')');

            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(c.x, c.y);
            ctx.strokeStyle = grad;
            ctx.lineWidth   = c.width;
            ctx.lineCap     = 'round';
            ctx.stroke();

            // Head sparkle
            ctx.save();
            ctx.shadowBlur  = 16;
            ctx.shadowColor = 'rgba(200,180,255,0.9)';
            ctx.beginPath();
            ctx.arc(c.x, c.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,252,255,' + a + ')';
            ctx.fill();
            ctx.restore();
        }
    }

    function draw(time) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var t = time * 0.001;

        // Stars
        for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            var alpha = s.baseAlpha + Math.sin(t * s.speed * 6.28 + s.offset) * 0.15;
            alpha = Math.max(0.04, Math.min(1, alpha));
            ctx.save();
            if (s.glow) {
                ctx.shadowBlur  = 11;
                ctx.shadowColor = 'rgba(' + s.tint + ', 0.9)';
            }
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + s.tint + ', ' + alpha + ')';
            ctx.fill();
            ctx.restore();
        }

        // Spawn & draw comets
        if (time - lastCometMs > COMET_EVERY) {
            spawnComet();
            lastCometMs = time;
        }
        drawComets();

        animId = requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', resize);
    animId = requestAnimationFrame(draw);
})();
</script>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ── Icons ──────────────────────────────────────── */
    const IconTrend = () => (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
    );
    const IconInfo = () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
    );
    const IconWarn = () => (
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
    );
    const IconChev = ({ open }) => (
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"
            style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform 0.22s' }}>
            <polyline points="6 9 12 15 18 9"/>
        </svg>
    );

    /* ── Candle loader ──────────────────────────────── */
    const CandleLoader = () => (
        <div style={{ display:'flex', alignItems:'flex-end', gap:'7px', height:'44px', justifyContent:'center' }}>
            {[
                { c:'#10f07a', cls:'ca', h:'80%' }, { c:'#ff4060', cls:'cb', h:'100%' },
                { c:'#10f07a', cls:'cc', h:'60%' }, { c:'#ff4060', cls:'ca', h:'90%' },
            ].map((s,i) => (
                <div key={i} className={s.cls} style={{
                    width:'9px', height:s.h, borderRadius:'3px',
                    background:`linear-gradient(to top,${s.c}55,${s.c})`,
                    boxShadow:`0 0 7px ${s.c}66`
                }}/>
            ))}
        </div>
    );

    /* ── Signal bar ─────────────────────────────────── */
    const SignalBar = ({ label, value, capm, isPrimary, disabled, disabledMsg, formula }) => {
        const bullish = !disabled && value > capm;
        const color = bullish ? 'var(--bull)' : 'var(--bear)';
        const max = disabled ? 1 : Math.max(capm, value) * 1.18;
        const capmPct = disabled ? 0 : Math.min((capm / max) * 100, 100);
        const valPct  = disabled ? 0 : Math.min((value / max) * 100, 100);

        return (
            <div style={{ marginBottom:'18px' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:'7px' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:'6px' }}>
                        <span style={{ fontSize:'0.83rem', color: disabled ? 'var(--text-dim)' : 'var(--text-secondary)', fontWeight: isPrimary ? 600 : 400 }}>{label}</span>
                        {isPrimary && !disabled && <span style={{ fontSize:'0.66rem', background:'rgba(16,240,122,0.12)', border:'1px solid rgba(16,240,122,0.3)', borderRadius:'10px', padding:'1px 7px', color:'var(--bull)', fontFamily:'var(--sans)' }}>PRIMARY</span>}
                    </div>
                    <span style={{ fontFamily:'var(--mono)', fontSize:'0.95rem', fontWeight:500, color: disabled ? 'var(--text-dim)' : color }}>
                        {disabled ? '—' : (value*100).toFixed(2)+'%'}
                        {!disabled && <span style={{ fontSize:'0.7rem', marginLeft:'5px', opacity:0.8 }}>
                            {bullish ? '▲' : '▼'} {Math.abs((value-capm)*100).toFixed(2)}%
                        </span>}
                    </span>
                </div>
                <div className="bar-track" style={{ position:'relative' }}>
                    {/* CAPM baseline marker */}
                    {!disabled && <div style={{ position:'absolute', left:capmPct+'%', top:'-3px', bottom:'-3px', width:'1.5px', background:'rgba(94,173,255,0.6)', zIndex:2 }}/>}
                    {/* Value bar */}
                    <div className={disabled ? '' : 'bar-animated'} style={{
                        height:'100%', borderRadius:'5px', width: disabled ? '0%' : valPct+'%',
                        background: disabled ? 'transparent' : `linear-gradient(90deg, ${color}55, ${color})`,
                        boxShadow: disabled ? 'none' : `0 0 8px ${color}55`
                    }}/>
                </div>
                {disabled && disabledMsg && (
                    <p style={{ fontSize:'0.72rem', color:'var(--gold)', marginTop:'5px', fontFamily:'var(--sans)' }}>⚠ {disabledMsg}</p>
                )}
                {!disabled && formula && (
                    <p style={{ fontSize:'0.72rem', color:'var(--text-dim)', marginTop:'4px', fontFamily:'var(--mono)' }}>{formula}</p>
                )}
            </div>
        );
    };

    /* ── CAPM bar (baseline) ────────────────────────── */
    const CAPMBar = ({ value, formula }) => (
        <div style={{ marginBottom:'18px' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:'7px' }}>
                <span style={{ fontSize:'0.83rem', color:'var(--text-secondary)', fontWeight:600 }}>CAPM Required Return</span>
                <span style={{ fontFamily:'var(--mono)', fontSize:'0.95rem', fontWeight:500, color:'var(--blue)' }}>{(value*100).toFixed(2)}%</span>
            </div>
            <div className="bar-track">
                <div className="bar-animated" style={{ height:'100%', width:'100%', borderRadius:'5px', background:'linear-gradient(90deg, rgba(94,173,255,0.3), rgba(94,173,255,0.6))' }}/>
            </div>
            <p style={{ fontSize:'0.72rem', color:'var(--text-dim)', marginTop:'4px', fontFamily:'var(--mono)' }}>{formula}</p>
        </div>
    );

    /* ── Main component ─────────────────────────────── */
    function CAPMGordonCalculator() {
        const [ticker, setTicker] = useState('');
        const [market, setMarket] = useState('VN');
        const [loading, setLoading] = useState(false);
        const [result, setResult] = useState(null);
        const [error, setError] = useState('');
        const [overrideEnabled, setOverrideEnabled] = useState(false);
        const [manualGrowth, setManualGrowth] = useState('');
        const [showFormulas, setShowFormulas] = useState(false);
        const [showAssumptions, setShowAssumptions] = useState(false);

        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:5000'
            : (window.CONFIG?.BACKEND_URL || window.location.origin);

        const fmt = (amount, currency) => {
            if (currency === 'VND')
                return new Intl.NumberFormat('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}).format(Math.round(amount)) + ' ₫';
            return '$' + new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(amount);
        };

        const calculateValuation = async (industryOverride = null, tickerOverride = null) => {
            const sym = (tickerOverride || ticker).trim();
            if (!sym) { setError('Please enter a stock ticker symbol'); return; }
            setLoading(true); setError(''); setResult(null);
            try {
                const params = new URLSearchParams({ market });
                if (overrideEnabled && manualGrowth) {
                    const g = parseFloat(manualGrowth) / 100;
                    if (!isNaN(g) && g >= 0 && g <= 0.20) params.append('growth_override', g.toFixed(4));
                }
                if (industryOverride) params.append('industry', industryOverride);
                const res = await fetch(`${API_URL}/api/valuation/${sym.toUpperCase()}?${params}`);
                if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error || `API ${res.status}`); }
                const data = await res.json();
                if (!data.ticker || !data.companyName) throw new Error('Invalid stock data received.');
                setResult(data);
            } catch (err) {
                let msg = err.message;
                if (msg.includes('Failed to fetch') || msg.includes('NetworkError'))
                    msg = 'Cannot connect to backend. Ensure the Python backend is running.';
                setError(msg);
            } finally { setLoading(false); }
        };

        /* ── Derived: Earnings Yield + g ──
         * Uses same adjusted perpetuity g as Gordon DDM for consistency.
         */
        const earningsGrowthRate = result?.dividendGrowth ?? 0;
        const earningsYield      = result?.eps > 0 ? result.eps / result.currentPrice : null;
        const earningsYieldReturn = earningsYield != null ? earningsYield + earningsGrowthRate : null;

        const hasGordon   = result && result.dividend > 0;
        const hasEarnings = earningsYieldReturn != null;

        const primaryValuation = result
            ? (hasGordon
                ? result.valuation
                : (hasEarnings
                    ? (earningsYieldReturn > result.capmReturn ? 'UNDERVALUED' : 'OVERVALUED')
                    : result.valuation))
            : null;

        /* ── Recommended tickers ─────────────────────────────────────────────
         * Curated for Gordon DDM suitability:
         *   VN  — HOSE blue-chips with consistent multi-year dividend track record
         *   US  — S&P 500 Dividend Aristocrats (25+ consecutive years of increases)
         *   AU  — ASX mature income stocks with stable franked dividend history
         * ────────────────────────────────────────────────────────────────── */
        const RECS = {
            VN: [['VNM','Vinamilk'],['SAB','Sabeco'],['GAS','PVGas'],['BVH','Bao Viet'],
                 ['REE','REE Corp'],['DHG','DHG Pharma'],['PNJ','PNJ Gold'],['VCB','Vietcombank'],
                 ['FPT','FPT Corp'],['DGW','Digiworld'],['MWG','Mobile World'],['PLX','Petrolimex']],
            US: [['KO','Coca-Cola'],['PG','P&G'],['JNJ','J&J'],['PEP','PepsiCo'],
                 ['MCD','McDonald\'s'],['WMT','Walmart'],['CL','Colgate'],['ABT','Abbott'],
                 ['AFL','Aflac'],['EMR','Emerson'],['CAT','Caterpillar'],['KMB','Kimberly-Clark']],
            AU: [['CBA','CommBank'],['NAB','NAB'],['WBC','Westpac'],['ANZ','ANZ'],
                 ['WES','Wesfarmers'],['WOW','Woolworths'],['TLS','Telstra'],['APA','APA Group'],
                 ['BHP','BHP'],['TCL','Transurban'],['MQG','Macquarie'],['CSL','CSL']],
        };

        const isBull = primaryValuation === 'UNDERVALUED';

        return (
            <div id="app">

                {/* ── HEADER ── */}
                <div style={{ textAlign:'center', padding:'36px 0 22px' }}>
                    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:'8px', marginBottom:'12px', color:'var(--blue)' }}>
                        <IconTrend/>
                        <span style={{ fontFamily:'var(--mono)', fontSize:'0.72rem', letterSpacing:'0.2em', color:'var(--text-secondary)', textTransform:'uppercase' }}>
                            Financial Valuation Terminal
                        </span>
                    </div>
                    <h1 className="header-title">CAPM &amp; Gordon Model</h1>
                    <p style={{ color:'var(--text-secondary)', fontSize:'0.87rem', margin:0, lineHeight:1.6 }}>
                        CAPM &nbsp;·&nbsp; Dividend Discount &nbsp;·&nbsp; Earnings Yield
                    </p>
                </div>

                {/* ── FORMULA INFO ── */}
                <div className="card" style={{ marginBottom:'10px' }}>
                    <button className="acc-btn" onClick={() => setShowFormulas(v => !v)}>
                        <span style={{ display:'flex', alignItems:'center', gap:'6px' }}><IconInfo/> How these signals work</span>
                        <IconChev open={showFormulas}/>
                    </button>
                    {showFormulas && (
                        <div style={{ padding:'0 18px 18px', display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(210px,1fr))', gap:'10px' }}>
                            {[
                                { title:'CAPM — Hurdle Rate', color:'var(--blue)', formula:'E(R) = Rf + β(Rm − Rf)', desc:'Risk-adjusted required return. Every signal must clear this bar.' },
                                { title:'Gordon DDM', color:'var(--bull)', formula:'E(R) = (D₁/P₀) + g', desc:'Uses perpetuity growth (g). Needs consistent dividends. Gordon > CAPM → undervalued.' },
                                { title:'Earnings Yield + g', color:'var(--gold)', formula:'E(R) = (EPS/P₀) + g', desc:'Uses same perpetuity growth (g) as Gordon DDM. Wider coverage — works without dividends.' },
                            ].map(f => (
                                <div key={f.title} style={{ background:'rgba(255,255,255,0.025)', border:'1px solid rgba(255,255,255,0.07)', borderRadius:'10px', padding:'12px' }}>
                                    <div style={{ color:f.color, fontWeight:600, fontSize:'0.78rem', marginBottom:'5px', fontFamily:'var(--mono)' }}>{f.title}</div>
                                    <div style={{ fontFamily:'var(--mono)', fontSize:'0.8rem', color:'#fff', marginBottom:'5px' }}>{f.formula}</div>
                                    <div style={{ fontSize:'0.75rem', color:'var(--text-secondary)', lineHeight:1.55 }}>{f.desc}</div>
                                </div>
                            ))}
                            <p style={{ gridColumn:'1/-1', fontSize:'0.73rem', color:'var(--text-secondary)', fontStyle:'italic', margin:0 }}>
                                ⚠ Gordon Model requires consistent dividend payments. Best for mature income-paying companies.<br/>
                                Earnings Yield uses the same <strong style={{color:'#fff'}}>perpetuity g</strong> as Gordon DDM — consistent, conservative growth assumption.
                            </p>
                        </div>
                    )}
                </div>

                {/* ── MARKET + WATCHLIST ── */}
                <div className="card" style={{ padding:'16px', marginBottom:'10px' }}>
                    <div className="section-label" style={{ marginBottom:'10px' }}>Select Market</div>
                    <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'8px', marginBottom:'14px' }}>
                        {[
                            { k:'VN', label:'Vietnam',      sm:'VN', flag:'/flags/vn.png', cls:'mkt-vn' },
                            { k:'US', label:'United States', sm:'US', flag:'/flags/us.png', cls:'mkt-us' },
                            { k:'AU', label:'Australia',    sm:'AU', flag:'/flags/au.png', cls:'mkt-au' },
                        ].map(m => (
                            <button key={m.k} onClick={() => setMarket(m.k)} disabled={loading}
                                className={`market-btn ${market === m.k ? m.cls : ''}`}>
                                <img src={m.flag} alt={m.label} style={{ width:'20px', height:'20px', borderRadius:'3px', objectFit:'cover' }}/>
                                <span className="hidden sm:inline">{m.label}</span>
                                <span className="sm:hidden">{m.sm}</span>
                            </button>
                        ))}
                    </div>
                    <div className="section-label" style={{ marginBottom:'7px' }}>
                        {market==='US' ? 'Dividend Aristocrats — 25+ years consecutive increases'
                         : market==='AU' ? 'ASX Mature Income Stocks — stable franked dividends'
                         : 'HOSE Blue-Chips — consistent dividend track record'}
                    </div>
                    <div style={{ display:'flex', flexWrap:'wrap', gap:'5px' }}>
                        {(RECS[market]||[]).map(([sym,name]) => (
                            <button key={sym} className="tkr-pill" title={name}
                                onClick={() => { setTicker(sym); calculateValuation(null, sym); }}>
                                <span className="tkr-sym">{sym}</span>
                                <span style={{ color:'var(--text-dim)', marginLeft:'4px' }}>{name}</span>
                            </button>
                        ))}
                    </div>
                    {market==='AU' && <p style={{fontSize:'0.71rem',color:'var(--text-secondary)',marginTop:'6px',fontStyle:'italic'}}>Franking credits apply — unique tax benefit for Australian dividends</p>}
                    {market==='VN' && <p style={{fontSize:'0.71rem',color:'var(--text-secondary)',marginTop:'6px',fontStyle:'italic'}}>Best suited for Gordon DDM — select mature firms with multi-year dividend history</p>}
                </div>

                {/* ── SEARCH ── */}
                <div className="card" style={{ padding:'16px', marginBottom:'20px' }}>
                    {overrideEnabled && (
                        <div style={{ display:'flex', alignItems:'center', gap:'10px', background:'rgba(255,196,69,0.05)', border:'1px solid rgba(255,196,69,0.18)', borderRadius:'9px', padding:'8px 12px', marginBottom:'12px' }}>
                            <span style={{ fontSize:'0.82rem', color:'var(--gold)', fontFamily:'var(--mono)', whiteSpace:'nowrap' }}>Override g =</span>
                            <input type="number" value={manualGrowth} onChange={e=>setManualGrowth(e.target.value)}
                                onKeyDown={e=>e.key==='Enter'&&calculateValuation()}
                                className="override-input" placeholder="3.5" min="0" max="20" step="0.1" disabled={loading}/>
                            <span style={{color:'var(--gold)',fontSize:'0.82rem',fontFamily:'var(--mono)'}}>%</span>
                            <button onClick={()=>{setOverrideEnabled(false);setManualGrowth('');}}
                                style={{marginLeft:'auto',background:'none',border:'1px solid rgba(255,196,69,0.22)',borderRadius:'6px',color:'var(--gold)',fontSize:'0.74rem',padding:'3px 10px',cursor:'pointer'}}>
                                Cancel
                            </button>
                        </div>
                    )}
                    <div className="section-label" style={{ marginBottom:'8px' }}>Stock Ticker Symbol</div>
                    <div style={{ display:'flex', gap:'8px' }}>
                        <input type="text" value={ticker}
                            onChange={e=>setTicker(e.target.value.toUpperCase())}
                            onKeyDown={e=>e.key==='Enter'&&calculateValuation()}
                            className="ticker-input" disabled={loading}
                            placeholder={market==='VN'?'VNM, VCB, FPT …':market==='AU'?'CBA, BHP, CSL …':'AAPL, MSFT, GOOGL …'}
                            style={{flex:1}}/>
                        <button onClick={()=>calculateValuation()} disabled={loading} className="btn-analyze">
                            {loading ? 'Analyzing…' : 'Analyze ↵'}
                        </button>
                    </div>
                </div>

                {/* ── LOADER ── */}
                {loading && (
                    <div style={{ textAlign:'center', padding:'44px 20px' }}>
                        <CandleLoader/>
                        <p style={{ color:'var(--text-secondary)', fontFamily:'var(--mono)', fontSize:'0.82rem', marginTop:'14px', letterSpacing:'0.04em' }}>
                            Fetching market data…
                        </p>
                    </div>
                )}

                {/* ── ERROR ── */}
                {error && !loading && (
                    <div className="err-box" style={{ marginBottom:'14px' }}>
                        <div style={{ color:'var(--bear)', flexShrink:0, marginTop:'1px' }}><IconWarn/></div>
                        <p style={{ color:'#ffb3bf', fontSize:'0.87rem', margin:0 }}>{error}</p>
                    </div>
                )}

                {/* ══════ RESULTS ══════════════════════════════ */}
                {result && !loading && (() => {
                    const gordonBull  = hasGordon   && result.gordonReturn   > result.capmReturn;
                    const earnBull    = hasEarnings  && earningsYieldReturn   > result.capmReturn;

                    return (
                        <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>

                            {/* ── VERDICT ── */}
                            <div className={`verdict a0 ${isBull ? 'verdict-bull' : 'verdict-bear'}`}>
                                {/* bg candle decoration */}
                                <div style={{ position:'absolute', right:'20px', top:'50%', transform:'translateY(-50%)', opacity:0.07, pointerEvents:'none' }}>
                                    <svg width="56" height="76" viewBox="0 0 56 76">
                                        <rect x="20" y="8" width="16" height="58" rx="2" fill={isBull?'var(--bull)':'var(--bear)'}/>
                                        <line x1="28" y1="0" x2="28" y2="8" stroke={isBull?'var(--bull)':'var(--bear)'} strokeWidth="3"/>
                                        <line x1="28" y1="66" x2="28" y2="76" stroke={isBull?'var(--bull)':'var(--bear)'} strokeWidth="3"/>
                                    </svg>
                                </div>
                                <div style={{ fontFamily:'var(--mono)', fontSize:'0.75rem', color:'rgba(255,255,255,0.45)', marginBottom:'6px', letterSpacing:'0.04em' }}>
                                    {result.ticker} · {result.companyName}
                                </div>
                                <div style={{ display:'flex', alignItems:'center', gap:'12px', flexWrap:'wrap', marginBottom:'12px' }}>
                                    <span className={`${isBull?'text-bull glow-bull':'text-bear glow-bear'}`}
                                        style={{ fontFamily:'var(--sans)', fontWeight:700, fontSize:'clamp(1.9rem,5vw,2.7rem)', letterSpacing:'-0.02em', lineHeight:1 }}>
                                        {isBull ? '▲' : '▼'} {primaryValuation}
                                    </span>
                                    <div>
                                        <div style={{ color:'rgba(255,255,255,0.82)', fontSize:'0.9rem', fontWeight:500 }}>
                                            {isBull ? 'Price below fair value — expected to RISE' : 'Price above fair value — expected to FALL'}
                                        </div>
                                        {!hasGordon && hasEarnings && (
                                            <div style={{ color:'var(--gold)', fontSize:'0.74rem', marginTop:'3px' }}>
                                                Gordon Model disabled (no dividend) — Earnings Yield is primary signal
                                            </div>
                                        )}
                                    </div>
                                </div>
                                <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
                                    <span style={{ background:'rgba(255,255,255,0.07)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:'20px', padding:'4px 14px', fontFamily:'var(--mono)', fontSize:'0.8rem', color:'rgba(255,255,255,0.7)' }}>
                                        {fmt(result.currentPrice, result.currency)} → {fmt(result.fairPrice, result.currency)}
                                    </span>
                                    <span style={{ background: result.priceDifference>0?'rgba(16,240,122,0.12)':'rgba(255,64,96,0.12)', border:`1px solid ${result.priceDifference>0?'rgba(16,240,122,0.28)':'rgba(255,64,96,0.28)'}`, borderRadius:'20px', padding:'4px 14px', fontFamily:'var(--mono)', fontSize:'0.8rem', color: result.priceDifference>0?'var(--bull)':'var(--bear)' }}>
                                        {result.priceDifference>0?'+':''}{result.priceDifference.toFixed(2)}%
                                    </span>
                                </div>
                            </div>

                            {/* ── WARNINGS ── */}
                            {result.lowDividendWarning && (
                                <div className="warn-box aL1">
                                    <div style={{color:'var(--gold)',flexShrink:0,marginTop:'1px'}}><IconWarn/></div>
                                    <p style={{color:'var(--gold)',fontSize:'0.85rem',margin:0,lineHeight:1.5}}>{result.lowDividendWarning}</p>
                                </div>
                            )}
                            {result.growthWarning && (
                                <div className="warn-box" style={{padding:'10px 14px'}}>
                                    <div style={{color:'var(--gold)',flexShrink:0}}><IconWarn/></div>
                                    <p style={{color:'rgba(255,196,69,0.85)',fontSize:'0.81rem',margin:0}}>{result.growthWarning}</p>
                                </div>
                            )}

                            {/* ── RETURN SIGNALS ── */}
                            <div className="card aL1" style={{ padding:'20px 22px' }}>
                                <div className="section-label" style={{ marginBottom:'18px' }}>Return Signal Comparison</div>

                                <CAPMBar
                                    value={result.capmReturn}
                                    formula={`${(result.riskFreeRate*100).toFixed(2)}% + ${result.beta.toFixed(3)}β × (${(result.marketReturn*100).toFixed(2)}% − ${(result.riskFreeRate*100).toFixed(2)}%)`}
                                />
                                <hr className="sep" style={{ marginBottom:'18px' }}/>

                                <SignalBar
                                    label="Gordon Dividend Discount Model"
                                    value={hasGordon ? result.gordonReturn : 0}
                                    capm={result.capmReturn}
                                    isPrimary={hasGordon}
                                    disabled={!hasGordon}
                                    disabledMsg="No dividend paid — Gordon Model not applicable"
                                    formula={hasGordon ? `(${fmt(result.dividendD1,result.currency)}/${fmt(result.currentPrice,result.currency)}) + ${(result.dividendGrowth*100).toFixed(2)}% g(perpetuity)` : null}
                                />

                                <SignalBar
                                    label={`Earnings Yield + g${!hasGordon?' ★':''}`}
                                    value={hasEarnings ? earningsYieldReturn : 0}
                                    capm={result.capmReturn}
                                    isPrimary={!hasGordon && hasEarnings}
                                    disabled={!hasEarnings}
                                    disabledMsg={!hasEarnings ? 'EPS ≤ 0 — Earnings Yield unavailable (loss-making company)' : null}
                                    formula={hasEarnings
                                        ? `(${fmt(result.eps,result.currency)} EPS / ${fmt(result.currentPrice,result.currency)}) + ${(earningsGrowthRate*100).toFixed(2)}% g (perpetuity)`
                                        : null}
                                />

                            </div>

                            {/* ── KEY METRICS ── */}
                            <div className="card aR2" style={{ padding:'20px 22px' }}>
                                <div className="section-label" style={{ marginBottom:'14px' }}>Key Metrics</div>
                                <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:'9px' }}>
                                    {[
                                        { label:'Beta (β)', val:result.beta.toFixed(3), note:'Market sensitivity', color:'var(--blue)' },
                                        { label:'Risk-Free Rate', val:(result.riskFreeRate*100).toFixed(2)+'%', note:'Gov. bond proxy', color:'var(--blue)' },
                                        { label:'Annual Dividend D₀', val:fmt(result.dividend,result.currency), note:'Last 12 months', color:'var(--bull)' },
                                        { label:'g (perpetuity)', val:(result.dividendGrowth*100).toFixed(2)+'%', note: result.growthDetails?.method==='industry'?'Damodaran GDP×weight': result.growthDetails?.method==='override'?'Manual override':'Hist. CAGR', color:'var(--purple)' },
                                    ].map(m => (
                                        <div key={m.label} className="metric-chip">
                                            <div style={{ fontSize:'0.7rem', color:'var(--text-secondary)', marginBottom:'4px' }}>{m.label}</div>
                                            <div className="metric-val" style={{ color:m.color }}>{m.val}</div>
                                            <div style={{ fontSize:'0.67rem', color:'var(--text-dim)', marginTop:'3px' }}>{m.note}</div>
                                        </div>
                                    ))}
                                </div>
                                {(result.eps || result.peRatio) && (
                                    <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:'9px', marginTop:'9px' }}>
                                        {result.eps && (
                                            <div className="metric-chip">
                                                <div style={{ fontSize:'0.7rem', color:'var(--text-secondary)', marginBottom:'4px' }}>EPS</div>
                                                <div className="metric-val" style={{color:'var(--gold)'}}>{fmt(result.eps,result.currency)}</div>
                                            </div>
                                        )}
                                        {result.peRatio && (
                                            <div className="metric-chip">
                                                <div style={{ fontSize:'0.7rem', color:'var(--text-secondary)', marginBottom:'4px' }}>Actual P/E Ratio</div>
                                                <div className="metric-val" style={{color:'var(--blue)'}}>{result.peRatio.toFixed(2)}×</div>
                                                {result.theoreticalPE && <div style={{fontSize:'0.67rem',color:'var(--text-dim)',marginTop:'3px'}}>Theoretical P/E: {result.theoreticalPE.toFixed(2)}×</div>}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* ── GROWTH BREAKDOWN ── */}
                            <div className="card aL3" style={{ overflow:'hidden' }}>
                                <div style={{ padding:'16px 22px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                                    <div className="section-label">g (perpetuity) Breakdown</div>
                                    {!overrideEnabled && (
                                        <button onClick={()=>setOverrideEnabled(true)}
                                            style={{background:'rgba(255,196,69,0.08)',border:'1px solid rgba(255,196,69,0.2)',borderRadius:'7px',color:'var(--gold)',fontSize:'0.73rem',padding:'4px 12px',cursor:'pointer',fontFamily:'var(--sans)'}}>
                                            Override g
                                        </button>
                                    )}
                                </div>
                                <hr className="sep"/>
                                <div style={{ padding:'16px 22px' }}>
                                    {result.growthDetails?.method === 'industry' ? (
                                        <div>
                                            {[
                                                { k:'Damodaran Industry (auto-detected)', v:result.growthDetails.industryName, vColor:'#fff' },
                                                result.tvSector || result.tvIndustry
                                                    ? { k:'TradingView classification', v:[result.tvIndustry,result.tvSector].filter(Boolean).join(' · '), vColor:'var(--text-secondary)', small:true }
                                                    : null,
                                                { k:'Industry EPS Growth — 5yr (analyst)', v: result.growthDetails.industryEpsGrowth!=null ? Number(result.growthDetails.industryEpsGrowth).toFixed(2)+'%' : 'N/A', vColor:'var(--gold)' },
                                                { k:'Benchmark Total Market EPS Growth', v: result.growthDetails.benchmarkEpsGrowth!=null ? Number(result.growthDetails.benchmarkEpsGrowth).toFixed(2)+'%' : 'N/A', vColor:'var(--text-secondary)' },
                                                { k:'Weight = Industry ÷ Benchmark', v: result.growthDetails.weight!=null ? Number(result.growthDetails.weight).toFixed(4) : 'N/A', vColor:'var(--text-secondary)' },
                                                { k:`GDP Base (${result.currency})`, v: result.growthDetails.gdpBase!=null ? (Number(result.growthDetails.gdpBase)*100).toFixed(1)+'%' : 'N/A', vColor:'var(--text-secondary)' },
                                            ].filter(Boolean).map(row => (
                                                <div key={row.k} className="data-row">
                                                    <span className="data-key" style={{fontSize:row.small?'0.75rem':undefined}}>{row.k}</span>
                                                    <span className="data-val" style={{color:row.vColor,fontSize:row.small?'0.75rem':undefined}}>{row.v}</span>
                                                </div>
                                            ))}
                                            <div style={{marginTop:'12px',paddingTop:'12px',borderTop:'1px solid rgba(255,255,255,0.07)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                                <span style={{color:'#fff',fontWeight:600,fontSize:'0.87rem'}}>
                                                    g (perpetuity) = GDP × Weight{result.growthDetails.capped?' (capped)':''}
                                                </span>
                                                <span style={{fontFamily:'var(--mono)',color:'var(--purple)',fontWeight:600,fontSize:'1.05rem'}}>{(result.dividendGrowth*100).toFixed(2)}%</span>
                                            </div>
                                            {result.growthDetails.note && (
                                                <p style={{color:'var(--text-secondary)',fontSize:'0.74rem',fontStyle:'italic',margin:'8px 0 0'}}>{result.growthDetails.note}</p>
                                            )}
                                            <p style={{color:'var(--text-dim)',fontSize:'0.7rem',margin:'6px 0 0'}}>Source: Damodaran NYU Stern {result.growthDetails.damodaranYear||2026}</p>
                                        </div>
                                    ) : result.growthDetails?.method === 'override' ? (
                                        <div>
                                            <p style={{color:'var(--gold)',fontWeight:600,fontFamily:'var(--mono)',margin:'0 0 4px'}}>Manual override: g (perpetuity) = {(result.dividendGrowth*100).toFixed(2)}%</p>
                                            <p style={{color:'var(--text-secondary)',fontSize:'0.78rem',margin:0}}>Damodaran industry calculation bypassed. Earnings Yield uses this same g as fallback.</p>
                                        </div>
                                    ) : (
                                        <div style={{display:'flex',flexDirection:'column',gap:'9px'}}>
                                            <p style={{color:'var(--text-secondary)',fontStyle:'italic',margin:0,fontSize:'0.83rem'}}>
                                                Industry not recognized from TradingView{(result.tvIndustry||result.tvSector)&&<span style={{color:'var(--text-dim)'}}> ({[result.tvIndustry,result.tvSector].filter(Boolean).join(' · ')})</span>} — using historical dividend CAGR.
                                            </p>
                                            <p style={{color:'#fff',fontFamily:'var(--mono)',fontWeight:500,margin:0}}>g (perpetuity) = {(result.dividendGrowth*100).toFixed(2)}%</p>
                                            {result.industrySuggestions?.length > 0 && (
                                                <div>
                                                    <p style={{color:'var(--text-secondary)',fontSize:'0.74rem',marginBottom:'7px'}}>Closest Damodaran matches — select to apply industry EPS growth:</p>
                                                    <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
                                                        {result.industrySuggestions.map(ind => (
                                                            <button key={ind} onClick={()=>calculateValuation(ind)} disabled={loading} className="suggest-pill">{ind}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* ── IRREGULAR DIVIDEND ── */}
                            {result.irregularDividend && result.dividendConsistencyIssues?.length > 0 && (
                                <div className="a3" style={{background:'rgba(251,146,60,0.07)',border:'1px solid rgba(251,146,60,0.22)',borderRadius:'12px',padding:'14px 18px',display:'flex',gap:'10px'}}>
                                    <div style={{color:'#fb923c',flexShrink:0,marginTop:'1px'}}><IconWarn/></div>
                                    <div>
                                        <p style={{color:'#fb923c',fontWeight:600,fontSize:'0.85rem',margin:'0 0 5px'}}>Irregular Dividend Pattern</p>
                                        <ul style={{color:'rgba(251,146,60,0.78)',fontSize:'0.78rem',margin:0,paddingLeft:'16px'}}>
                                            {result.dividendConsistencyIssues.map((iss,i)=><li key={i}>{iss}</li>)}
                                        </ul>
                                    </div>
                                </div>
                            )}

                            {/* ── P/E ANALYSIS ── */}
                            {result.peRatio && (
                                <div className="card aR3" style={{padding:'20px 22px'}}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}}>
                                        <div className="section-label">P/E Ratio Analysis</div>
                                        {result.currency==='VND'&&<span style={{fontSize:'0.7rem',color:'var(--text-dim)'}}>VCI via vnstock</span>}
                                    </div>
                                    {result.dividendGrowth > result.capmReturn && (
                                        <div className="warn-box" style={{marginBottom:'14px'}}>
                                            <div style={{color:'var(--gold)',flexShrink:0}}><IconWarn/></div>
                                            <p style={{color:'var(--gold)',fontSize:'0.8rem',margin:0}}>High-growth stock: g ({(result.dividendGrowth*100).toFixed(2)}%) exceeds kₑ ({(result.capmReturn*100).toFixed(2)}%). Theoretical P/E undefined — Gordon inapplicable.</p>
                                        </div>
                                    )}
                                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(185px,1fr))',gap:'16px'}}>
                                        <div>
                                            <div style={{fontSize:'0.75rem',color:'var(--text-secondary)',fontWeight:600,marginBottom:'10px'}}>Key Drivers</div>
                                            {[
                                                { k:'EPS', v:fmt(result.eps,result.currency), c:'var(--gold)' },
                                                { k:'Actual P/E', v:result.peRatio.toFixed(2)+'×', c:'var(--blue)' },
                                                result.theoreticalPE?{ k:'Theoretical P/E', v:result.theoreticalPE.toFixed(2)+'×', c:'var(--text-secondary)' }:null,
                                            ].filter(Boolean).map(r=>(
                                                <div key={r.k} className="data-row">
                                                    <span className="data-key">{r.k}</span>
                                                    <span className="data-val" style={{color:r.c}}>{r.v}</span>
                                                </div>
                                            ))}
                                        </div>
                                        <div>
                                            <div style={{fontSize:'0.75rem',color:'var(--text-secondary)',fontWeight:600,marginBottom:'10px'}}>Components</div>
                                            {[
                                                result.payoutRatio!=null?{ k:'Payout Ratio', v:(result.payoutRatio*100).toFixed(1)+'%' }:null,
                                                result.retentionRatio!=null?{ k:'Retention Ratio', v:(result.retentionRatio*100).toFixed(1)+'%' }:null,
                                                { k:'Required Return kₑ', v:(result.capmReturn*100).toFixed(2)+'%' },
                                                { k:'g (perpetuity)', v:(result.dividendGrowth*100).toFixed(2)+'%' },
                                            ].filter(Boolean).map(r=>(
                                                <div key={r.k} className="data-row">
                                                    <span className="data-key">{r.k}</span>
                                                    <span className="data-val">{r.v}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    {result.payoutRatio && result.theoreticalPE && (
                                        <div style={{marginTop:'12px',paddingTop:'12px',borderTop:'1px solid rgba(255,255,255,0.06)',fontSize:'0.76rem',color:'var(--text-secondary)',fontFamily:'var(--mono)'}}>
                                            P/E = {(result.payoutRatio*100).toFixed(1)}% ÷ ({(result.capmReturn*100).toFixed(2)}% − {(result.dividendGrowth*100).toFixed(2)}%) = {result.theoreticalPE.toFixed(2)}×
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* ── INTERPRETATION ── */}
                            <div className="card aL4" style={{padding:'20px 22px'}}>
                                <div className="section-label" style={{marginBottom:'14px'}}>Interpretation</div>
                                <p style={{color:'rgba(240,244,255,0.85)',fontSize:'0.88rem',lineHeight:1.78,margin:0}}>
                                    {isBull
                                        ? <>The primary return signal (<span style={{color:'var(--bull)',fontFamily:'var(--mono)'}}>{hasGordon?(result.gordonReturn*100).toFixed(2):(earningsYieldReturn*100).toFixed(2)}%</span>) clears the CAPM hurdle (<span style={{color:'var(--blue)',fontFamily:'var(--mono)'}}>{(result.capmReturn*100).toFixed(2)}%</span>). The stock appears <span style={{color:'var(--bull)',fontWeight:700}}>undervalued</span> at {fmt(result.currentPrice,result.currency)} — implied fair value is <span style={{color:'var(--bull)',fontWeight:600}}>{fmt(result.fairPrice,result.currency)}</span>. Theory expects the price to <span style={{color:'var(--bull)',fontWeight:600}}>rise</span> toward equilibrium.</>
                                        : <>The primary return signal (<span style={{color:'var(--bear)',fontFamily:'var(--mono)'}}>{hasGordon?(result.gordonReturn*100).toFixed(2):(earningsYieldReturn*100).toFixed(2)}%</span>) falls below the CAPM hurdle (<span style={{color:'var(--blue)',fontFamily:'var(--mono)'}}>{(result.capmReturn*100).toFixed(2)}%</span>). The stock appears <span style={{color:'var(--bear)',fontWeight:700}}>overvalued</span> at {fmt(result.currentPrice,result.currency)} — implied fair value is <span style={{color:'var(--bear)',fontWeight:600}}>{fmt(result.fairPrice,result.currency)}</span>. Theory expects the price to <span style={{color:'var(--bear)',fontWeight:600}}>fall</span> toward equilibrium.</>
                                    }
                                </p>
                            </div>

                            {/* ── DATA SOURCES ── */}
                            {result.sources && (
                                <div className="card aR4" style={{padding:'16px 22px'}}>
                                    <div className="section-label" style={{marginBottom:'11px'}}>Data Sources</div>
                                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(195px,1fr))',gap:'5px 16px'}}>
                                        {Object.entries(result.sources).map(([k,v])=>(
                                            <div key={k} style={{display:'flex',gap:'6px',fontSize:'0.77rem'}}>
                                                <span style={{color:'var(--text-dim)',textTransform:'capitalize',whiteSpace:'nowrap'}}>{k.replace(/([A-Z])/g,' $1').trim()}:</span>
                                                <span style={{color:'var(--text-secondary)'}}>{v}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <p style={{fontSize:'0.7rem',color:'var(--text-dim)',marginTop:'9px',fontStyle:'italic'}}>
                                        Powered by TradingView · Yahoo Finance · Damodaran NYU Stern 2026
                                    </p>
                                </div>
                            )}

                            {/* ── ASSUMPTIONS ACCORDION ── */}
                            <div className="card aL5" style={{overflow:'hidden'}}>
                                <button className="acc-btn" onClick={()=>setShowAssumptions(v=>!v)}>
                                    <span style={{display:'flex',alignItems:'center',gap:'6px'}}><IconInfo/> Model Assumptions &amp; Limitations</span>
                                    <IconChev open={showAssumptions}/>
                                </button>
                                {showAssumptions && (
                                    <div style={{padding:'0 22px 18px',display:'flex',flexDirection:'column',gap:'12px'}}>
                                        {[
                                            { t:'CAPM Assumptions', items:['Diversified portfolios — unsystematic risk eliminated','Single-period transaction horizon','Borrow/lend at risk-free rate — no friction','Perfect capital markets — no transaction costs','Homogeneous investor expectations'] },
                                            { t:'Gordon Growth Model Assumptions', items:['Company exists in perpetuity','Dividends grow at constant rate g forever','Required return kₑ must exceed g','Stable macro environment'] },
                                            { t:'Earnings Yield Notes', items:['Uses same GDP-weighted perpetuity g as Gordon DDM for consistency','Provides broader coverage — valid even for non-dividend-paying stocks','Primary signal when Gordon DDM unavailable (no dividend)'] },
                                            { t:'Key Limitations', items:['CAPM ignores transaction costs and market inefficiencies','Gordon DDM breaks down for irregular/zero-dividend payers','Neither model captures sentiment, news, or macro shocks'] },
                                        ].map(s=>(
                                            <div key={s.t}>
                                                <div style={{fontSize:'0.78rem',fontWeight:600,color:'var(--text-secondary)',marginBottom:'6px'}}>{s.t}</div>
                                                <ul style={{margin:0,paddingLeft:'16px',display:'flex',flexDirection:'column',gap:'3px'}}>
                                                    {s.items.map((it,i)=><li key={i} style={{fontSize:'0.77rem',color:'var(--text-dim)',lineHeight:1.55}}>{it}</li>)}
                                                </ul>
                                            </div>
                                        ))}
                                        <p style={{fontSize:'0.73rem',color:'var(--text-dim)',fontStyle:'italic',margin:0}}>
                                            <a href="https://www.investopedia.com/terms/c/capm.asp" target="_blank" rel="noopener noreferrer" style={{color:'var(--blue)',textDecoration:'none'}}>CAPM</a>{' · '}
                                            <a href="https://www.investopedia.com/terms/g/gordongrowthmodel.asp" target="_blank" rel="noopener noreferrer" style={{color:'var(--blue)',textDecoration:'none'}}>Gordon Growth Model</a>
                                        </p>
                                    </div>
                                )}
                            </div>

                            <p style={{textAlign:'center',color:'var(--text-dim)',fontSize:'0.7rem',fontStyle:'italic',lineHeight:1.65,margin:'2px 0 0'}}>
                                Theoretical models only. Not investment advice.<br/>
                                Actual prices may diverge due to market sentiment, corporate events, and macro factors.
                            </p>
                        </div>
                    );
                })()}

                {/* Footer */}
                <div style={{textAlign:'center',marginTop:'44px',paddingBottom:'8px'}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'7px',color:'var(--text-dim)',fontSize:'0.7rem',fontFamily:'var(--mono)'}}>
                        <span className="pulse-dot" style={{width:'5px',height:'5px',borderRadius:'50%',background:'var(--bull)',display:'inline-block',boxShadow:'0 0 6px var(--bull)'}}/>
                        CAPM · Gordon DDM · Earnings Yield Terminal
                    </div>
                </div>

            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CAPMGordonCalculator/>);
</script>
</body>
</html>
