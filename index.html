<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CAPM & Gordon Model — Stock Valuation Terminal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://va.vercel-scripts.com/v1/script.debug.js"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --bg: #030508;
            --card-bg: rgba(12, 14, 28, 0.92);
            --card-border: rgba(140,100,255,0.22);
            --card-border-bright: rgba(170,130,255,0.45);
            --bull: #10f07a;
            --bull-glow: rgba(16, 240, 122, 0.22);
            --bear: #ff4060;
            --bear-glow: rgba(255, 64, 96, 0.22);
            --blue: #5eadff;
            --blue-glow: rgba(94, 173, 255, 0.15);
            --gold: #ffc445;
            --purple: #c084fc;
            --cosmic: #a78bfa;
            --text-primary: #f0f4ff;
            --text-secondary: #8fa3c0;
            --text-dim: #3d4a6a;
            --mono: 'DM Mono', monospace;
            --sans: 'Sora', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ── Star canvas layer ─────────────────────────── */
        #star-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Galaxy nebula ─────────────────────────────── */
        #nebula {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 70% 55% at 15% 20%, rgba(120,60,255,0.09) 0%, transparent 60%),
                radial-gradient(ellipse 55% 60% at 88% 78%, rgba(255,64,96,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 55% 5%,  rgba(60,130,255,0.07) 0%, transparent 58%),
                radial-gradient(ellipse 40% 50% at 78% 30%, rgba(180,80,255,0.06) 0%, transparent 55%),
                radial-gradient(ellipse 60% 35% at 30% 80%, rgba(16,200,180,0.04) 0%, transparent 55%);
            animation: nebula-drift 30s ease-in-out infinite alternate;
        }
        #nebula-pulse {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse 40% 40% at 50% 50%, rgba(100,60,200,0.03) 0%, transparent 70%);
            animation: nebula-pulse 8s ease-in-out infinite alternate;
        }
        @keyframes nebula-drift {
            0%   { opacity: 0.65; transform: scale(1)    translateY(0); }
            100% { opacity: 1;    transform: scale(1.07) translateY(-18px); }
        }
        @keyframes nebula-pulse {
            0%   { opacity: 0.4; transform: scale(0.95); }
            100% { opacity: 1;   transform: scale(1.08); }
        }

        /* ── App wrapper ───────────────────────────────── */
        #app { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 16px 14px 56px; }

        /* ── Cards ─────────────────────────────────────── */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-shadow: 0 2px 20px rgba(0,0,0,0.55), inset 0 1px 0 rgba(160,120,255,0.1);
        }
        .card::before {
            content: '';
            position: absolute; top: 0; left: 5%; right: 5%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(180,140,255,0.5), rgba(120,190,255,0.3), transparent);
            pointer-events: none;
        }
        .card:hover {
            border-color: var(--card-border-bright);
            box-shadow: 0 0 32px rgba(120,80,255,0.14), 0 4px 28px rgba(0,0,0,0.55), inset 0 1px 0 rgba(180,140,255,0.18);
        }

        /* ── Section label ─────────────────────────────── */
        .section-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-weight: 600;
        }

        /* ── Verdict banner ────────────────────────────── */
        .verdict {
            border-radius: 16px;
            padding: 28px 28px 24px;
            position: relative; overflow: hidden;
            animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }
        .verdict-bull {
            background: linear-gradient(135deg, rgba(16,240,122,0.15) 0%, rgba(8,14,28,0.97) 55%);
            border: 1px solid rgba(16,240,122,0.45);
            box-shadow: 0 0 60px rgba(16,240,122,0.15), 0 0 120px rgba(16,240,122,0.07), inset 0 1px 0 rgba(16,240,122,0.3), 0 4px 24px rgba(0,0,0,0.6);
        }
        .verdict-bear {
            background: linear-gradient(135deg, rgba(255,64,96,0.15) 0%, rgba(8,14,28,0.97) 55%);
            border: 1px solid rgba(255,64,96,0.45);
            box-shadow: 0 0 60px rgba(255,64,96,0.15), 0 0 120px rgba(255,64,96,0.07), inset 0 1px 0 rgba(255,64,96,0.3), 0 4px 24px rgba(0,0,0,0.6);
        }
        .verdict::after {
            content: '';
            position: absolute; top: -60px; right: -60px;
            width: 200px; height: 200px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ── Text ──────────────────────────────────────── */
        .text-bull  { color: var(--bull); }
        .text-bear  { color: var(--bear); }
        .text-blue  { color: var(--blue); }
        .text-gold  { color: var(--gold); }
        .text-purple{ color: var(--purple); }

        .glow-bull { text-shadow: 0 0 24px rgba(16,240,122,0.55); }
        .glow-bear { text-shadow: 0 0 24px rgba(255,64,96,0.55); }

        .num { font-family: var(--mono); }

        /* ── Animations ────────────────────────────────── */
        @keyframes fadeUp {
            from { opacity:0; transform: translateY(22px); }
            to   { opacity:1; transform: translateY(0); }
        }
        @keyframes fadeLeft {
            from { opacity:0; transform: translateX(-36px); }
            to   { opacity:1; transform: translateX(0); }
        }
        @keyframes fadeRight {
            from { opacity:0; transform: translateX(36px); }
            to   { opacity:1; transform: translateX(0); }
        }
        .a0  { animation: fadeUp    0.55s 0.00s cubic-bezier(0.16,1,0.3,1) both; }
        .a1  { animation: fadeUp    0.50s 0.08s cubic-bezier(0.16,1,0.3,1) both; }
        .a2  { animation: fadeUp    0.50s 0.16s cubic-bezier(0.16,1,0.3,1) both; }
        .a3  { animation: fadeUp    0.50s 0.24s cubic-bezier(0.16,1,0.3,1) both; }
        .a4  { animation: fadeUp    0.50s 0.32s cubic-bezier(0.16,1,0.3,1) both; }
        .a5  { animation: fadeUp    0.50s 0.40s cubic-bezier(0.16,1,0.3,1) both; }
        /* Directional card entrances */
        .aL1 { animation: fadeLeft  0.55s 0.08s cubic-bezier(0.16,1,0.3,1) both; }
        .aR2 { animation: fadeRight 0.55s 0.16s cubic-bezier(0.16,1,0.3,1) both; }
        .aL3 { animation: fadeLeft  0.55s 0.24s cubic-bezier(0.16,1,0.3,1) both; }
        .aR3 { animation: fadeRight 0.55s 0.24s cubic-bezier(0.16,1,0.3,1) both; }
        .aL4 { animation: fadeLeft  0.55s 0.32s cubic-bezier(0.16,1,0.3,1) both; }
        .aR4 { animation: fadeRight 0.55s 0.32s cubic-bezier(0.16,1,0.3,1) both; }
        .aL5 { animation: fadeLeft  0.55s 0.40s cubic-bezier(0.16,1,0.3,1) both; }

        /* Bar grow */
        @keyframes barGrow { from { width:0; } }
        .bar-animated { animation: barGrow 0.9s 0.35s cubic-bezier(0.34,1.56,0.64,1) both; }

        /* Candle loader */
        @keyframes ca { 0%,100%{transform:scaleY(0.35)} 50%{transform:scaleY(1)} }
        @keyframes cb { 0%,100%{transform:scaleY(1)}    50%{transform:scaleY(0.3)} }
        @keyframes cc { 0%,33%{transform:scaleY(0.6)}   66%{transform:scaleY(0.28)} 100%{transform:scaleY(0.9)} }
        .ca { animation: ca 1.15s ease-in-out infinite; transform-origin:bottom; }
        .cb { animation: cb 1.0s 0.2s ease-in-out infinite; transform-origin:bottom; }
        .cc { animation: cc 1.1s 0.4s ease-in-out infinite; transform-origin:bottom; }

        /* Pulse dot */
        @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.45;transform:scale(0.75)} }
        .pulse-dot { animation: pulseDot 2.2s ease-in-out infinite; }

        /* ── Inputs ────────────────────────────────────── */
        .ticker-input {
            background: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(255,255,255,0.14);
            border-radius: 10px;
            color: #fff;
            font-family: var(--mono);
            font-size: 1.15rem;
            font-weight: 500;
            letter-spacing: 0.07em;
            outline: none;
            padding: 13px 18px;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .ticker-input:focus {
            border-color: var(--blue);
            background: rgba(94,173,255,0.06);
            box-shadow: 0 0 0 3px rgba(94,173,255,0.12), 0 0 20px rgba(94,173,255,0.08);
        }
        .ticker-input::placeholder { color: var(--text-dim); font-weight: 300; }
        .ticker-input:disabled { opacity: 0.45; cursor: not-allowed; }

        .override-input {
            background: rgba(255,196,69,0.07);
            border: 1.5px solid rgba(255,196,69,0.3);
            border-radius: 8px;
            color: var(--gold);
            font-family: var(--mono);
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            padding: 6px 10px;
            width: 78px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .override-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(255,196,69,0.1);
        }

        /* ── Buttons ───────────────────────────────────── */
        .btn-analyze {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border: none; border-radius: 10px;
            color: #fff;
            font-family: var(--sans);
            font-size: 0.93rem; font-weight: 600;
            padding: 13px 26px;
            cursor: pointer; white-space: nowrap;
            box-shadow: 0 4px 18px rgba(99,102,241,0.35);
            transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
        }
        .btn-analyze:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(99,102,241,0.5);
        }
        .btn-analyze:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }

        .market-btn {
            background: rgba(255,255,255,0.035);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--text-secondary);
            font-family: var(--sans);
            font-size: 0.88rem; font-weight: 500;
            padding: 10px 14px;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px; justify-content: center;
            transition: all 0.18s;
        }
        .market-btn:hover:not(:disabled) { background: rgba(255,255,255,0.07); color: var(--text-primary); border-color: rgba(255,255,255,0.2); }
        .mkt-vn { background: rgba(220,38,38,0.1); border-color: rgba(220,38,38,0.35); color: #fca5a5; }
        .mkt-us { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.35); color: #93c5fd; }
        .mkt-au { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.35); color: #86efac; }

        /* ── Ticker pill ───────────────────────────────── */
        .tkr-pill {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 7px;
            padding: 4px 9px;
            font-family: var(--mono);
            font-size: 0.77rem;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.14s;
        }
        .tkr-pill:hover { background: rgba(255,255,255,0.09); color: #fff; border-color: rgba(255,255,255,0.2); }
        .tkr-sym { color: #fff; font-weight: 500; }

        /* ── Signal bar ────────────────────────────────── */
        .bar-track {
            background: rgba(255,255,255,0.06);
            border-radius: 5px; height: 7px;
            width: 100%; overflow: hidden;
        }

        /* ── Metric chip ───────────────────────────────── */
        .metric-chip {
            background: rgba(16,18,38,0.9);
            border: 1px solid rgba(140,100,255,0.2);
            border-radius: 10px;
            padding: 14px 15px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        .metric-val { font-family: var(--mono); font-size: 1.2rem; font-weight: 500; color: #fff; }

        /* ── Separator ─────────────────────────────────── */
        .sep { border: none; border-top: 1px solid rgba(255,255,255,0.07); margin: 0; }

        /* ── Suggest pill ──────────────────────────────── */
        .suggest-pill {
            background: rgba(192,132,252,0.08);
            border: 1px solid rgba(192,132,252,0.22);
            border-radius: 20px; color: var(--purple);
            font-family: var(--sans); font-size: 0.76rem;
            padding: 4px 12px; cursor: pointer;
            transition: all 0.14s;
        }
        .suggest-pill:hover:not(:disabled) {
            background: rgba(192,132,252,0.16);
            border-color: rgba(192,132,252,0.45); color: #e9d5ff;
        }

        /* ── Data row ──────────────────────────────────── */
        .data-row {
            display: flex; justify-content: space-between; align-items: baseline;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .data-row:last-child { border-bottom: none; }
        .data-key { color: var(--text-secondary); font-size: 0.83rem; }
        .data-val { font-family: var(--mono); font-size: 0.87rem; color: #fff; font-weight: 500; }

        /* ── Info accordion ────────────────────────────── */
        .acc-btn {
            width: 100%; background: none; border: none; cursor: pointer;
            padding: 13px 18px; display: flex; justify-content: space-between; align-items: center;
            color: var(--text-secondary); font-family: var(--sans); font-size: 0.8rem;
        }
        .acc-btn:hover { color: var(--text-primary); }

        /* ── Sensitivity sliders ───────────────────────── */
        .sens-slider {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 4px; border-radius: 2px; outline: none; cursor: pointer;
            background: rgba(255,255,255,0.10);
        }
        .sens-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 15px; height: 15px;
            border-radius: 50%; cursor: pointer;
            background: var(--purple);
            box-shadow: 0 0 8px rgba(192,132,252,0.55);
            transition: box-shadow 0.15s;
        }
        .sens-slider::-webkit-slider-thumb:hover { box-shadow: 0 0 14px rgba(192,132,252,0.8); }
        .sens-slider-r { -webkit-appearance: none; appearance: none;
            width: 100%; height: 4px; border-radius: 2px; outline: none; cursor: pointer;
            background: rgba(255,255,255,0.10);
        }
        .sens-slider-r::-webkit-slider-thumb {
            -webkit-appearance: none; width: 15px; height: 15px;
            border-radius: 50%; cursor: pointer;
            background: var(--blue);
            box-shadow: 0 0 8px rgba(94,173,255,0.55);
            transition: box-shadow 0.15s;
        }
        .sens-slider-r::-webkit-slider-thumb:hover { box-shadow: 0 0 14px rgba(94,173,255,0.8); }

        /* ── Scrollbar ─────────────────────────────────── */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        /* ── Header glow ───────────────────────────────── */
        .header-title {
            font-family: var(--sans); font-weight: 700;
            font-size: clamp(1.6rem, 4vw, 2.3rem);
            background: linear-gradient(135deg, #ffffff 0%, #d4b8ff 30%, #7eb8ff 65%, #b8a0ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.025em; margin: 0 0 8px;
            filter: drop-shadow(0 0 20px rgba(140,100,255,0.3));
        }

        /* ── Warning box ───────────────────────────────── */
        .warn-box {
            background: rgba(255,196,69,0.09);
            border: 1px solid rgba(255,196,69,0.35);
            border-radius: 10px; padding: 12px 16px;
            display: flex; gap: 10px; align-items: flex-start;
            box-shadow: 0 2px 16px rgba(0,0,0,0.4);
        }
        .err-box {
            background: rgba(255,64,96,0.1);
            border: 1px solid rgba(255,64,96,0.4);
            border-radius: 10px; padding: 14px 18px;
            display: flex; gap: 10px; align-items: flex-start;
            box-shadow: 0 2px 16px rgba(0,0,0,0.4);
        }

        /* ── Info tooltip (i) ───────────────────────────── */
        .info-tip {
            position: relative; display: inline-flex;
            align-items: center; margin-left: 4px; cursor: help;
            vertical-align: middle;
        }
        .info-tip-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 13px; height: 13px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.32);
            font-size: 0.58rem; font-style: normal;
            font-family: var(--sans); font-weight: 700;
            flex-shrink: 0; line-height: 1; user-select: none;
            transition: border-color 0.12s, color 0.12s;
        }
        .info-tip:hover .info-tip-icon {
            border-color: rgba(255,255,255,0.55);
            color: rgba(255,255,255,0.7);
        }
        .info-tip-popup {
            position: absolute;
            bottom: calc(100% + 8px); left: 50%;
            transform: translateX(-50%);
            min-width: 210px; max-width: 260px;
            background: #111827;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 9px 12px;
            font-size: 0.71rem; color: rgba(255,255,255,0.72);
            line-height: 1.55; z-index: 1000;
            pointer-events: none; opacity: 0; visibility: hidden;
            transition: opacity 0.13s, visibility 0.13s;
            white-space: normal; text-align: left;
            box-shadow: 0 6px 24px rgba(0,0,0,0.55);
        }
        .info-tip:hover .info-tip-popup { opacity: 1; visibility: visible; }
        /* keep tooltip visible even when it overflows its card */
        .info-tip-popup strong { color: #fff; font-weight: 600; }
    </style>
</head>
<body>

<!-- Galaxy canvas -->
<canvas id="star-canvas"></canvas>
<!-- Nebula layers -->
<div id="nebula"></div>
<div id="nebula-pulse"></div>

<div id="root" style="position:relative;z-index:1;"></div>

<!-- Galaxy field + comet animation -->
<script>
(function() {
    var canvas = document.getElementById('star-canvas');
    var ctx = canvas.getContext('2d');
    var stars = [];
    var comets = [];
    var lastCometMs = 0;
    var COMET_EVERY = 3800;
    var animId;

    // Star tints: mostly cool white-blue, some warm gold, some purple
    var TINTS = ['215,228,255','200,215,255','180,200,255','255,240,200','220,180,255'];

    function buildStars() {
        stars = [];
        var count = Math.min(Math.max(Math.floor((canvas.width * canvas.height) / 4500), 160), 340);
        for (var i = 0; i < count; i++) {
            var r = Math.random();
            var isBright = r > 0.95;
            var isMed    = r > 0.76;
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: isBright ? Math.random() * 1.1 + 1.6
                       : isMed   ? Math.random() * 0.8 + 0.7
                       :           Math.random() * 0.45 + 0.15,
                baseAlpha: isBright ? Math.random() * 0.22 + 0.72
                          : isMed   ? Math.random() * 0.38 + 0.3
                          :           Math.random() * 0.28 + 0.14,
                speed:  Math.random() * 0.007 + 0.002,
                offset: Math.random() * Math.PI * 2,
                glow:   isBright,
                tint:   TINTS[Math.floor(Math.random() * TINTS.length)]
            });
        }
    }

    function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        buildStars();
    }

    function spawnComet() {
        var fromLeft = Math.random() > 0.5;
        // Angle: slight diagonal, mostly horizontal
        var angleDeg = (Math.random() * 18 - 9) + (fromLeft ? 0 : 180);
        var angleRad = angleDeg * Math.PI / 180;
        var speed = 6 + Math.random() * 5;
        comets.push({
            x:       fromLeft ? -100 : canvas.width + 100,
            y:       canvas.height * (0.05 + Math.random() * 0.7),
            vx:      Math.cos(angleRad) * speed,
            vy:      Math.sin(angleRad) * speed,
            tailLen: 100 + Math.random() * 130,
            life:    0,
            maxLife: 80 + Math.random() * 60,
            width:   1.2 + Math.random() * 0.8
        });
    }

    function drawComets() {
        for (var j = comets.length - 1; j >= 0; j--) {
            var c = comets[j];
            c.life++;
            c.x += c.vx;
            c.y += c.vy;
            if (c.life > c.maxLife) { comets.splice(j, 1); continue; }

            var prog = c.life / c.maxLife;
            // Fade in first 15%, hold, fade out last 20%
            var a = prog < 0.15 ? prog / 0.15
                  : prog > 0.80 ? (1 - prog) / 0.20
                  : 1;
            a = Math.min(a * 0.85, 0.85);

            var spd = Math.hypot(c.vx, c.vy);
            var nx  = c.vx / spd;
            var ny  = c.vy / spd;
            var tx  = c.x - nx * c.tailLen;
            var ty  = c.y - ny * c.tailLen;

            var grad = ctx.createLinearGradient(tx, ty, c.x, c.y);
            grad.addColorStop(0,   'rgba(160,140,255,0)');
            grad.addColorStop(0.5, 'rgba(200,180,255,' + (a * 0.35) + ')');
            grad.addColorStop(1,   'rgba(240,235,255,' + a + ')');

            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(c.x, c.y);
            ctx.strokeStyle = grad;
            ctx.lineWidth   = c.width;
            ctx.lineCap     = 'round';
            ctx.stroke();

            // Head sparkle
            ctx.save();
            ctx.shadowBlur  = 16;
            ctx.shadowColor = 'rgba(200,180,255,0.9)';
            ctx.beginPath();
            ctx.arc(c.x, c.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,252,255,' + a + ')';
            ctx.fill();
            ctx.restore();
        }
    }

    function draw(time) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var t = time * 0.001;

        // Stars
        for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            var alpha = s.baseAlpha + Math.sin(t * s.speed * 6.28 + s.offset) * 0.15;
            alpha = Math.max(0.04, Math.min(1, alpha));
            ctx.save();
            if (s.glow) {
                ctx.shadowBlur  = 11;
                ctx.shadowColor = 'rgba(' + s.tint + ', 0.9)';
            }
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + s.tint + ', ' + alpha + ')';
            ctx.fill();
            ctx.restore();
        }

        // Spawn & draw comets
        if (time - lastCometMs > COMET_EVERY) {
            spawnComet();
            lastCometMs = time;
        }
        drawComets();

        animId = requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', resize);
    animId = requestAnimationFrame(draw);
})();
</script>

                                        // ── Tier chip colours ────────────────────────────
                                        const TIER_COLOR = {
                                            lagging:     '#f87171',  // red   — structurally below market
                                            market:      '#94a3b8',  // slate — tracking economy
                                            above:       '#34d399',  // green — clear outperformer
                                            high_growth: '#fbbf24',  // gold  — structural advantage
                                            baseline:    '#64748b',  // gray  — fallback
                                        };
                                        const tierLabel = t => ({
                                            lagging:'Lagging', market:'Market',
                                            above:'Above avg', high_growth:'High growth',
                                            baseline:'Baseline',
                                        }[t] || t);

                                        // Column panel for one g calculation.
                                        // rows: [{k, v, c?, chipColor?, tip?}]
                                        //   tip       → shows (i) icon next to the row key label
                                        //   chipColor → renders value as a coloured pill badge
                                        // titleTip  → (i) next to panel title
                                        // gLabelTip → (i) next to the result row label
                                        const GPanel = ({title, titleTip, badge, badgeColor, rows,
                                                         gLabel, gLabelTip, gValue, gNote, isCapped, accentColor}) => (
                                            <div style={{
                                                background:'rgba(255,255,255,0.03)',
                                                border:`1px solid ${accentColor}33`,
                                                borderRadius:'10px',
                                                padding:'12px 14px',
                                                display:'flex', flexDirection:'column', gap:'0',
                                                overflow:'visible',   /* allow tooltips to escape card */
                                            }}>
                                                {/* panel header */}
                                                <div style={{display:'flex',alignItems:'center',gap:'7px',marginBottom:'10px',paddingBottom:'8px',borderBottom:`1px solid ${accentColor}22`}}>
                                                    <span style={{color:accentColor,fontWeight:700,fontSize:'0.8rem'}}>{title}</span>
                                                    {titleTip && <InfoTip text={titleTip}/>}
                                                    <span style={{background:`${accentColor}22`,color:badgeColor,fontSize:'0.65rem',padding:'1px 6px',borderRadius:'4px',fontFamily:'var(--mono)',marginLeft:titleTip?'2px':'0'}}>{badge}</span>
                                                </div>
                                                {/* data rows */}
                                                {rows.map(r => r && (
                                                    <div key={r.k} className="data-row" style={{padding:'2px 0',overflow:'visible'}}>
                                                        <span style={{color:'var(--text-secondary)',fontSize:'0.75rem',display:'inline-flex',alignItems:'center'}}>
                                                            {r.k}
                                                            {r.tip && <InfoTip text={r.tip}/>}
                                                        </span>
                                                        {r.chipColor
                                                            ? <span style={{background:r.chipColor+'28',color:r.chipColor,fontFamily:'var(--mono)',fontSize:'0.7rem',padding:'1px 8px',borderRadius:'4px',fontWeight:600}}>{r.v}</span>
                                                            : <span style={{color:r.c||'var(--text-secondary)',fontFamily:'var(--mono)',fontSize:'0.77rem'}}>{r.v}</span>
                                                        }
                                                    </div>
                                                ))}
                                                {/* result row */}
                                                <div style={{marginTop:'9px',paddingTop:'9px',borderTop:`1px solid ${accentColor}22`,display:'flex',justifyContent:'space-between',alignItems:'center',overflow:'visible'}}>
                                                    <span style={{color:'#fff',fontWeight:600,fontSize:'0.8rem',display:'inline-flex',alignItems:'center'}}>
                                                        {gLabel}{isCapped?' (capped)':''}
                                                        {gLabelTip && <InfoTip text={gLabelTip}/>}
                                                    </span>
                                                    <span style={{fontFamily:'var(--mono)',color:accentColor,fontWeight:700,fontSize:'1.0rem'}}>{gValue}</span>
                                                </div>
                                                {gNote && <p style={{color:'var(--text-secondary)',fontSize:'0.71rem',fontStyle:'italic',margin:'5px 0 0'}}>{gNote}</p>}
                                            </div>
                                        );

                                        return (
                                            <div>
                                                <HeaderRows/>

                                                {useRegional ? (
                                                    /* ── Two-column regional view ── */
                                                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>

                                                        {/* ── EY g panel ── histgr 5yr EPS, short-term, above GDP allowed */}
                                                        {(() => {
                                                            const eyFinalG      = earningsGrowthRate;
                                                            // eyTier is null when histgr data wasn't available for this industry/region
                                                            const eyHasData     = gd.eyTier != null;

                                                            if (!eyHasData) {
                                                                // ── Fallback state: no histgr benchmark ─────────────────────
                                                                // Damodaran's histgr file either didn't include this industry or
                                                                // the Total Market benchmark row wasn't loaded.
                                                                // EY g falls back to Gordon's fundamental ROE×b as a proxy.
                                                                const eyIndustryPct = gd.industryHistGrowth != null
                                                                    ? Number(gd.industryHistGrowth).toFixed(2)+'%'
                                                                    : null;
                                                                const fallbackRows = [
                                                                    eyIndustryPct
                                                                        ? { k:'5yr EPS Forecast', v: eyIndustryPct, c:'var(--blue)',
                                                                            tip:'Industry 5yr EPS data was found but the Total Market benchmark is unavailable — ratio/tier cannot be computed. EY g uses fundamental ROE×b as proxy.' }
                                                                        : { k:'5yr EPS Forecast', v:'No data', c:'#64748b' },
                                                                    { k:'Benchmark TM', v:'Not loaded', c:'#64748b' },
                                                                ];
                                                                return (
                                                                    <GPanel
                                                                        title="Earnings Yield g"
                                                                        titleTip="Short-term growth signal using Damodaran's 5-year analyst EPS consensus (histgr file). No benchmark data is available for this industry/region, so EY g uses the fundamental ROE×b as a conservative proxy."
                                                                        badge="histgr · no data"
                                                                        badgeColor="#64748b"
                                                                        accentColor="#5eadff"
                                                                        rows={fallbackRows}
                                                                        gLabel="EY g = ROE×b proxy"
                                                                        gLabelTip="Damodaran's histgr file (5yr EPS forecasts) doesn't have a Total Market benchmark for this region/industry. Without a benchmark, tier classification is not possible. EY g falls back to the fundamental ROE×b rate from the Gordon panel — a conservative proxy."
                                                                        gValue={(eyFinalG*100).toFixed(2)+'%'}
                                                                        isCapped={false}
                                                                        gNote={gd.earnings_yield_g_note}
                                                                    />
                                                                );
                                                            }

                                                            // ── Normal state: histgr data available ─────────────────────────
                                                            const eyTierColor = TIER_COLOR[gd.eyTier] || '#94a3b8';
                                                            const eyBenchActual = gd.benchmarkHistGrowth;
                                                            const eyBenchEff    = gd.eyEffectiveBenchmark;
                                                            const eyFloored     = eyBenchEff != null && eyBenchActual != null
                                                                                  && eyBenchEff > eyBenchActual + 0.01;
                                                            const eyCapPct      = gd.eyCapPct != null
                                                                                  ? Number(gd.eyCapPct).toFixed(1)+'%' : 'N/A';
                                                            const eyIndustryPct = gd.industryHistGrowth != null
                                                                                  ? Number(gd.industryHistGrowth).toFixed(2)+'%' : 'N/A';
                                                            const eyMultStr     = gd.eyCapMult!=null ? Number(gd.eyCapMult).toFixed(1) : '?';

                                                            const eyRows = [
                                                                { k:'5yr EPS Forecast',
                                                                  v: eyIndustryPct, c:'var(--blue)' },
                                                                { k:'Benchmark TM (actual)',
                                                                  v: eyBenchActual!=null ? Number(eyBenchActual).toFixed(2)+'%':'N/A' },
                                                                eyFloored
                                                                    ? { k:'Eff. Benchmark (↑ floored)',
                                                                        v: Number(eyBenchEff).toFixed(2)+'%',
                                                                        c:'rgba(94,173,255,0.5)',
                                                                        tip:'The actual Total Market benchmark was below 50% of the GDP base — likely a data anomaly. A near-zero benchmark makes the ratio meaningless. The floor (0.5× GDP base) keeps the tier classification reliable without distorting the result.' }
                                                                    : null,
                                                                { k:'Ratio (industry ÷ eff. bench)',
                                                                  v: gd.eyRatio!=null ? Number(gd.eyRatio).toFixed(2)+'×':'N/A',
                                                                  tip:'How much faster (or slower) this sector\'s 5yr EPS consensus grows vs the total market. Used only to classify the sector tier — it does not directly scale g. A ratio close to 1.0× means the industry tracks the market.' },
                                                                { k:'Sector tier',
                                                                  v: tierLabel(gd.eyTier),
                                                                  chipColor: eyTierColor,
                                                                  tip:'Sectors are classified by ratio into four tiers. For EY g (short-term signal, above GDP allowed): Lagging <0.75× → cap 1.0× GDP. Market 0.75–1.5× → cap 1.5× GDP. Above avg 1.5–3× → cap 2.0× GDP. High growth ≥3× → cap 2.0× GDP. EY caps are more permissive than Gordon since 5yr forecasts reflect near-term momentum, not perpetuity.' },
                                                                { k:`EY Cap (${eyMultStr}× GDP)`,
                                                                  v: eyCapPct, c:'rgba(94,173,255,0.6)',
                                                                  tip:`The maximum EY g allowed for this sector tier. EY g = min(5yr EPS forecast, this cap). The tier multiplier (${eyMultStr}×) reflects how much near-term industry outperformance we credit — more permissive than Gordon since the 5yr forecast is not a perpetuity rate.` },
                                                                { k:`GDP Base (${result.currency})`,
                                                                  v: gdpPct,
                                                                  tip:'Long-run nominal GDP growth for this region — the anchor for all tier caps. US ≈ 2.5%, AU ≈ 2.5%, VN ≈ 5.5%. All cap multipliers are applied to this base, so higher-growth economies naturally have higher absolute ceilings.' },
                                                            ];

                                                            return (
                                                                <GPanel
                                                                    title="Earnings Yield g"
                                                                    titleTip="Short-term growth signal using Damodaran's 5-year analyst EPS consensus (histgr file). Captures current industry momentum. Above-GDP values are allowed since this is not a true perpetuity rate — it reflects near-term industry health. Used as the growth component in the Earnings Yield return model."
                                                                    badge="histgr · 5yr EPS"
                                                                    badgeColor="var(--blue)"
                                                                    accentColor="#5eadff"
                                                                    rows={eyRows}
                                                                    gLabel="EY g = min(5yr EPS, cap)"
                                                                    gLabelTip="Final EY g is the smaller of: the raw 5yr EPS forecast, and the tier cap (mult × GDP). If the forecast is below the cap, the industry is growing modestly — use it directly. If above: near-term analyst optimism exceeds what the tier supports — use the cap."
                                                                    gValue={(eyFinalG*100).toFixed(2)+'%'}
                                                                    isCapped={gd.eyCapPct!=null && gd.industryHistGrowth!=null
                                                                              && gd.industryHistGrowth/100 > gd.eyCapPct/100 + 0.0005}
                                                                    gNote={gd.earnings_yield_g_note}
                                                                />
                                                            );
                                                        })()}

                                                        {/* ── Gordon g panel ── fundgr ROE×b, perpetuity, GDP-anchored */}
                                                        {(() => {
                                                            const gTierColor = TIER_COLOR[gd.tier] || '#94a3b8';
                                                            const gBenchActual = gd.benchmarkEpsGrowth;
                                                            const gBenchEff    = gd.effectiveBenchmark;
                                                            const gFloored     = gBenchEff != null && gBenchActual != null
                                                                                 && gBenchEff > gBenchActual + 0.01;
                                                            const gCapPct      = gd.capPct != null
                                                                                 ? Number(gd.capPct).toFixed(1)+'%' : 'N/A';
                                                            const gIndustryPct = gd.industryEpsGrowth != null
                                                                                 ? Number(gd.industryEpsGrowth).toFixed(2)+'%' : 'N/A';
                                                            const gMultStr     = gd.capMult!=null ? Number(gd.capMult).toFixed(1) : '?';

                                                            // gd.g = Damodaran tier result; result.dividendGrowth = after CAPM safety cap
                                                            const damodaranG = gd.g;
                                                            const finalG     = result.dividendGrowth;
                                                            const capmCapActive = result.growthWarning &&
                                                                damodaranG != null &&
                                                                Math.abs(damodaranG - finalG) > 0.0005;

                                                            const gRows = [
                                                                { k:'Fundamental (ROE×b)',
                                                                  v: gIndustryPct, c:'var(--purple)',
                                                                  tip:'ROE × retention ratio — the Du Pont sustainable growth identity. This is the rate a company can grow purely from reinvested earnings without needing external capital. Unlike analyst forecasts, this is an accounting identity grounded in the balance sheet.' },
                                                                { k:'Benchmark TM (actual)',
                                                                  v: gBenchActual!=null ? Number(gBenchActual).toFixed(2)+'%':'N/A',
                                                                  tip:'Damodaran\'s Total Market fundamental growth rate for this region. Used as the denominator in the ratio to classify this sector\'s relative growth strength.' },
                                                                gFloored
                                                                    ? { k:'Eff. Benchmark (↑ floored)',
                                                                        v: Number(gBenchEff).toFixed(2)+'%',
                                                                        c:'rgba(192,132,252,0.5)',
                                                                        tip:'The actual Total Market benchmark was below 50% of the GDP base — likely a data anomaly (e.g. VN Total Market fundgr ≈ 0.67%). Without this floor, the ratio would be 14.9× instead of 3.6×, placing every VN sector in "High growth" regardless of actual performance. The floor at 0.5× GDP keeps the classification meaningful.' }
                                                                    : null,
                                                                { k:'Ratio (industry ÷ eff. bench)',
                                                                  v: gd.ratio!=null ? Number(gd.ratio).toFixed(2)+'×':'N/A',
                                                                  tip:'How much faster this sector\'s ROE×b grows vs the total market fundamental rate. Used only to classify the tier — it does not scale g directly. This controlled use replaces the old GDP×weight formula where the ratio was multiplied directly, causing explosions when the benchmark was near-zero.' },
                                                                { k:'Sector tier',
                                                                  v: tierLabel(gd.tier),
                                                                  chipColor: gTierColor,
                                                                  tip:'Sectors are classified by ratio into four tiers. For Gordon g (perpetuity, must anchor near GDP): Lagging <0.75× → cap 0.9× GDP. Market 0.75–1.5× → cap 1.0× GDP. Above avg 1.5–3× → cap 1.1× GDP. High growth ≥3× → cap 1.2× GDP. Even the highest tier only claims 20% above GDP forever — conservative by design, since competitive equilibrium erodes excess returns over time.' },
                                                                { k:`Gordon Cap (${gMultStr}× GDP)`,
                                                                  v: gCapPct, c:'rgba(192,132,252,0.6)',
                                                                  tip:`Perpetuity g cannot be arbitrarily high. Cap = ${gMultStr}× GDP for this tier. In perpetuity, no company can sustainably outgrow the economy it operates in — competitive pressure erodes excess returns. The tier cap is the ceiling; if ROE×b is below it, we use ROE×b directly (the Du Pont rate is theoretically sound). If above, we apply the cap.` },
                                                                { k:`GDP Base (${result.currency})`,
                                                                  v: gdpPct,
                                                                  tip:'Long-run nominal GDP growth for this region — the anchor for all perpetuity g caps. In equilibrium, no firm can grow faster than the economy forever. Higher-growth economies (VN ≈ 5.5%) naturally allow higher absolute ceilings than mature markets (US ≈ 2.5%).' },
                                                                capmCapActive
                                                                    ? { k:'Tier g (before CAPM cap)',
                                                                        v: (damodaranG*100).toFixed(2)+'%',
                                                                        c:'rgba(192,132,252,0.45)',
                                                                        tip:'The Gordon model requires g < required return r (CAPM). If the tier result still exceeded r, a safety cap was applied: g = max(r − 3%, 3%). This row shows the tier result before that final adjustment.' }
                                                                    : null,
                                                            ];

                                                            const gordonLabel = capmCapActive
                                                                ? 'Gordon g (CAPM safety cap)'
                                                                : 'Gordon g = min(ROE×b, cap)';

                                                            const gordonLabelTip = capmCapActive
                                                                ? 'The tier cap result still exceeded the CAPM required return. The Gordon DDM formula P = D₁ ÷ (r − g) is undefined when g ≥ r, so a safety cap brings g below r. This is a mathematical constraint, not an economic judgment.'
                                                                : 'Final Gordon g = min(ROE×b from fundgr, tier cap). If ROE×b < cap: the industry is within its sustainable ceiling — use the accounting identity directly. If ROE×b > cap: current profitability exceeds what is sustainable in perpetuity — apply the tier cap.';

                                                            const gordonNote = [
                                                                gd.note,
                                                                capmCapActive ? result.growthWarning : null,
                                                            ].filter(Boolean).join('  ·  ');

                                                            return (
                                                                <GPanel
                                                                    title="Gordon DDM g"
                                                                    titleTip="Structural perpetuity rate from Damodaran's fundamental growth: ROE × retention ratio (fundgr file). This is the Du Pont sustainable growth identity — the rate a company can grow purely from retained earnings. Used as g in the Gordon Dividend Discount Model: Fair Price = D₁ ÷ (r − g). Capped near GDP since no industry can outgrow the economy forever."
                                                                    badge="fundgr · ROE×b"
                                                                    badgeColor="var(--purple)"
                                                                    accentColor="#c084fc"
                                                                    rows={gRows}
                                                                    gLabel={gordonLabel}
                                                                    gLabelTip={gordonLabelTip}
                                                                    gValue={(finalG*100).toFixed(2)+'%'}
                                                                    isCapped={gd.capped || capmCapActive}
                                                                    gNote={gordonNote||undefined}
                                                                />
                                                            );
                                                        })()}
                                                    </div>
                                                ) : (
                                                    /* ── Legacy single-column view ── */
                                                    <div>
                                                        {[
                                                            { k:'Industry EPS Growth — 5yr', v: gd.industryEpsGrowth!=null ? Number(gd.industryEpsGrowth).toFixed(2)+'%':'N/A', vColor:'var(--gold)' },
                                                            { k:'Benchmark Total Market',    v: gd.benchmarkEpsGrowth!=null ? Number(gd.benchmarkEpsGrowth).toFixed(2)+'%':'N/A', vColor:'var(--text-secondary)' },
                                                            { k:'Weight = Industry ÷ Benchmark', v: gd.weight!=null ? Number(gd.weight).toFixed(4):'N/A', vColor:'var(--text-secondary)' },
                                                            { k:`GDP Base (${result.currency})`, v: gdpPct, vColor:'var(--text-secondary)' },
                                                        ].map(row => (
                                                            <div key={row.k} className="data-row">
                                                                <span className="data-key">{row.k}</span>
                                                                <span className="data-val" style={{color:row.vColor}}>{row.v}</span>
                                                            </div>
                                                        ))}
                                                        <div style={{marginTop:'12px',paddingTop:'12px',borderTop:'1px solid rgba(255,255,255,0.07)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                                            <span style={{color:'#fff',fontWeight:600,fontSize:'0.87rem'}}>g (perpetuity) = GDP × Weight{gd.capped?' (capped)':''}</span>
                                                            <span style={{fontFamily:'var(--mono)',color:'var(--purple)',fontWeight:600,fontSize:'1.05rem'}}>{(result.dividendGrowth*100).toFixed(2)}%</span>
                                                        </div>
                                                        {gd.note && <p style={{color:'var(--text-secondary)',fontSize:'0.74rem',fontStyle:'italic',margin:'8px 0 0'}}>{gd.note}</p>}
                                                        <p style={{color:'var(--text-dim)',fontSize:'0.71rem',margin:'6px 0 0',fontStyle:'italic'}}>Using legacy US dataset — regional data loading on startup</p>
                                                    </div>
                                                )}

                                                <p style={{color:'var(--text-dim)',fontSize:'0.7rem',margin:'10px 0 0'}}>Source: Damodaran NYU Stern {gd.damodaranYear||2026}</p>
                                            </div>
                                        );
                                    })() : result.growthDetails?.method === 'override' ? (
                                        <div>
                                            <p style={{color:'var(--gold)',fontWeight:600,fontFamily:'var(--mono)',margin:'0 0 4px'}}>Manual override: g (perpetuity) = {(result.dividendGrowth*100).toFixed(2)}%</p>
                                            <p style={{color:'var(--text-secondary)',fontSize:'0.78rem',margin:0}}>Damodaran industry calculation bypassed. Earnings Yield uses this same g as fallback.</p>
                                        </div>
                                    ) : (
                                        <div style={{display:'flex',flexDirection:'column',gap:'9px'}}>
                                            <p style={{color:'var(--text-secondary)',fontStyle:'italic',margin:0,fontSize:'0.83rem'}}>
                                                Industry not recognized from TradingView{(result.tvIndustry||result.tvSector)&&<span style={{color:'var(--text-dim)'}}> ({[result.tvIndustry,result.tvSector].filter(Boolean).join(' · ')})</span>} — using historical dividend CAGR.
                                            </p>
                                            <p style={{color:'#fff',fontFamily:'var(--mono)',fontWeight:500,margin:0}}>g (perpetuity) = {(result.dividendGrowth*100).toFixed(2)}%</p>
                                            {result.industrySuggestions?.length > 0 && (
                                                <div>
                                                    <p style={{color:'var(--text-secondary)',fontSize:'0.74rem',marginBottom:'7px'}}>Closest Damodaran matches — select to apply industry EPS growth:</p>
                                                    <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
                                                        {result.industrySuggestions.map(ind => (
                                                            <button key={ind} onClick={()=>calculateValuation(ind)} disabled={loading} className="suggest-pill">{ind}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* ── IRREGULAR DIVIDEND ── */}
                            {result.irregularDividend && result.dividendConsistencyIssues?.length > 0 && (
                                <div className="a3" style={{background:'rgba(251,146,60,0.07)',border:'1px solid rgba(251,146,60,0.22)',borderRadius:'12px',padding:'14px 18px',display:'flex',gap:'10px'}}>
                                    <div style={{color:'#fb923c',flexShrink:0,marginTop:'1px'}}><IconWarn/></div>
                                    <div>
                                        <p style={{color:'#fb923c',fontWeight:600,fontSize:'0.85rem',margin:'0 0 5px'}}>Irregular Dividend Pattern</p>
                                        <ul style={{color:'rgba(251,146,60,0.78)',fontSize:'0.78rem',margin:0,paddingLeft:'16px'}}>
                                            {result.dividendConsistencyIssues.map((iss,i)=><li key={i}>{iss}</li>)}
                                        </ul>
                                    </div>
                                </div>
                            )}

                            {/* ── SENSITIVITY HEATMAP ── */}
                            {hasGordon && (
                                <SensitivityHeatmap
                                    dividend={result.dividend}
                                    currentPrice={result.currentPrice}
                                    baseG={result.dividendGrowth}
                                    baseR={result.capmReturn}
                                />
                            )}

                            {/* ── P/E ANALYSIS ── */}
                            {result.peRatio && (
                                <div className="card aR3" style={{padding:'20px 22px'}}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}}>
                                        <div className="section-label">P/E Ratio Analysis</div>
                                        {result.currency==='VND'&&<span style={{fontSize:'0.7rem',color:'var(--text-dim)'}}>VCI via vnstock</span>}
                                    </div>
                                    {result.dividendGrowth > result.capmReturn && (
                                        <div className="warn-box" style={{marginBottom:'14px'}}>
                                            <div style={{color:'var(--gold)',flexShrink:0}}><IconWarn/></div>
                                            <p style={{color:'var(--gold)',fontSize:'0.8rem',margin:0}}>High-growth stock: g ({(result.dividendGrowth*100).toFixed(2)}%) exceeds kₑ ({(result.capmReturn*100).toFixed(2)}%). Theoretical P/E undefined — Gordon inapplicable.</p>
                                        </div>
                                    )}
                                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(185px,1fr))',gap:'16px'}}>
                                        <div>
                                            <div style={{fontSize:'0.75rem',color:'var(--text-secondary)',fontWeight:600,marginBottom:'10px'}}>Key Drivers</div>
                                            {[
                                                { k:'EPS', v:fmt(result.eps,result.currency), c:'var(--gold)' },
                                                { k:'Actual P/E', v:result.peRatio.toFixed(2)+'×', c:'var(--blue)' },
                                                result.theoreticalPE?{ k:'Theoretical P/E', v:result.theoreticalPE.toFixed(2)+'×', c:'var(--text-secondary)' }:null,
                                            ].filter(Boolean).map(r=>(
                                                <div key={r.k} className="data-row">
                                                    <span className="data-key">{r.k}</span>
                                                    <span className="data-val" style={{color:r.c}}>{r.v}</span>
                                                </div>
                                            ))}
                                        </div>
                                        <div>
                                            <div style={{fontSize:'0.75rem',color:'var(--text-secondary)',fontWeight:600,marginBottom:'10px'}}>Components</div>
                                            {[
                                                result.payoutRatio!=null?{ k:'Payout Ratio', v:(result.payoutRatio*100).toFixed(1)+'%' }:null,
                                                result.retentionRatio!=null?{ k:'Retention Ratio', v:(result.retentionRatio*100).toFixed(1)+'%' }:null,
                                                { k:'Required Return kₑ', v:(result.capmReturn*100).toFixed(2)+'%' },
                                                { k:'g (perpetuity)', v:(result.dividendGrowth*100).toFixed(2)+'%' },
                                            ].filter(Boolean).map(r=>(
                                                <div key={r.k} className="data-row">
                                                    <span className="data-key">{r.k}</span>
                                                    <span className="data-val">{r.v}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    {result.payoutRatio && result.theoreticalPE && (
                                        <div style={{marginTop:'12px',paddingTop:'12px',borderTop:'1px solid rgba(255,255,255,0.06)',display:'flex',flexDirection:'column',gap:'4px'}}>
                                            {/* Payout derivation — answers "how do you get payout ratio?" */}
                                            {result.dividend != null && result.eps != null && (
                                                <div style={{fontSize:'0.75rem',color:'var(--text-dim)',fontFamily:'var(--mono)'}}>
                                                    Payout = {fmt(result.dividend,result.currency)} div ÷ {fmt(result.eps,result.currency)} EPS = {(result.payoutRatio*100).toFixed(1)}%
                                                </div>
                                            )}
                                            <div style={{fontSize:'0.76rem',color:'var(--text-secondary)',fontFamily:'var(--mono)'}}>
                                                P/E = {(result.payoutRatio*100).toFixed(1)}% ÷ ({(result.capmReturn*100).toFixed(2)}% − {(result.dividendGrowth*100).toFixed(2)}%) = {result.theoreticalPE.toFixed(2)}×
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* ── INTERPRETATION ── */}
                            <div className="card aL4" style={{padding:'20px 22px'}}>
                                <div className="section-label" style={{marginBottom:'14px'}}>Interpretation</div>
                                <p style={{color:'rgba(240,244,255,0.85)',fontSize:'0.88rem',lineHeight:1.78,margin:0}}>
                                    {isBull
                                        ? <>The primary return signal (<span style={{color:'var(--bull)',fontFamily:'var(--mono)'}}>{hasGordon?(result.gordonReturn*100).toFixed(2):(earningsYieldReturn*100).toFixed(2)}%</span>) clears the CAPM hurdle (<span style={{color:'var(--blue)',fontFamily:'var(--mono)'}}>{(result.capmReturn*100).toFixed(2)}%</span>). The stock appears <span style={{color:'var(--bull)',fontWeight:700}}>undervalued</span> at {fmt(result.currentPrice,result.currency)} — implied fair value is <span style={{color:'var(--bull)',fontWeight:600}}>{fmt(result.fairPrice,result.currency)}</span>. Theory expects the price to <span style={{color:'var(--bull)',fontWeight:600}}>rise</span> toward equilibrium.</>
                                        : <>The primary return signal (<span style={{color:'var(--bear)',fontFamily:'var(--mono)'}}>{hasGordon?(result.gordonReturn*100).toFixed(2):(earningsYieldReturn*100).toFixed(2)}%</span>) falls below the CAPM hurdle (<span style={{color:'var(--blue)',fontFamily:'var(--mono)'}}>{(result.capmReturn*100).toFixed(2)}%</span>). The stock appears <span style={{color:'var(--bear)',fontWeight:700}}>overvalued</span> at {fmt(result.currentPrice,result.currency)} — implied fair value is <span style={{color:'var(--bear)',fontWeight:600}}>{fmt(result.fairPrice,result.currency)}</span>. Theory expects the price to <span style={{color:'var(--bear)',fontWeight:600}}>fall</span> toward equilibrium.</>
                                    }
                                </p>
                            </div>

                            {/* ── DATA SOURCES ── */}
                            {result.sources && (
                                <div className="card aR4" style={{padding:'16px 22px'}}>
                                    <div className="section-label" style={{marginBottom:'11px'}}>Data Sources</div>
                                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(195px,1fr))',gap:'5px 16px'}}>
                                        {(() => {
                                            // Human-readable labels — override the auto camelCase split for
                                            // growth fields so they're clearly tied to their model context.
                                            const LABELS = {
                                                beta:                'Beta',
                                                riskFreeRate:        'Risk Free Rate',
                                                marketReturn:        'Market Return',
                                                currentPrice:        'Current Price',
                                                dividend:            'Dividend',
                                                dividendGrowth:      'Gordon g',
                                                earningsYieldGrowth: 'EY Growth',
                                            };
                                            return Object.entries(result.sources)
                                                .filter(([,v]) => v)
                                                .map(([k,v]) => (
                                                    <div key={k} style={{display:'flex',gap:'6px',fontSize:'0.77rem'}}>
                                                        <span style={{color:'var(--text-dim)',whiteSpace:'nowrap'}}>
                                                            {LABELS[k] || k.replace(/([A-Z])/g,' $1').trim()}:
                                                        </span>
                                                        <span style={{color:'var(--text-secondary)'}}>{v}</span>
                                                    </div>
                                                ));
                                        })()}
                                    </div>
                                    <p style={{fontSize:'0.7rem',color:'var(--text-dim)',marginTop:'9px',fontStyle:'italic'}}>
                                        Powered by TradingView · Yahoo Finance · Damodaran NYU Stern 2026
                                    </p>
                                </div>
                            )}

                            {/* ── ASSUMPTIONS ACCORDION ── */}
                            <div className="card aL5" style={{overflow:'hidden'}}>
                                <button className="acc-btn" onClick={()=>setShowAssumptions(v=>!v)}>
                                    <span style={{display:'flex',alignItems:'center',gap:'6px'}}><IconInfo/> Model Assumptions &amp; Limitations</span>
                                    <IconChev open={showAssumptions}/>
                                </button>
                                {showAssumptions && (
                                    <div style={{padding:'0 22px 18px',display:'flex',flexDirection:'column',gap:'12px'}}>
                                        {[
                                            { t:'CAPM Assumptions', items:['Diversified portfolios — unsystematic risk eliminated','Single-period transaction horizon','Borrow/lend at risk-free rate — no friction','Perfect capital markets — no transaction costs','Homogeneous investor expectations'] },
                                            { t:'Gordon Growth Model Assumptions', items:['Company exists in perpetuity','Dividends grow at constant rate g forever','Required return kₑ must exceed g','Stable macro environment'] },
                                            { t:'Earnings Yield Notes', items:['Uses Damodaran 5yr analyst EPS consensus (histgr) — a short-term signal, not a perpetuity rate','Above-GDP g is allowed since 5yr forecasts reflect near-term momentum rather than steady-state','Provides broader coverage — valid even for non-dividend-paying stocks'] },
                                            { t:'Key Limitations', items:['CAPM ignores transaction costs and market inefficiencies','Gordon DDM breaks down for irregular/zero-dividend payers','Neither model captures sentiment, news, or macro shocks'] },
                                        ].map(s=>(
                                            <div key={s.t}>
                                                <div style={{fontSize:'0.78rem',fontWeight:600,color:'var(--text-secondary)',marginBottom:'6px'}}>{s.t}</div>
                                                <ul style={{margin:0,paddingLeft:'16px',display:'flex',flexDirection:'column',gap:'3px'}}>
                                                    {s.items.map((it,i)=><li key={i} style={{fontSize:'0.77rem',color:'var(--text-dim)',lineHeight:1.55}}>{it}</li>)}
                                                </ul>
                                            </div>
                                        ))}
                                        <p style={{fontSize:'0.73rem',color:'var(--text-dim)',fontStyle:'italic',margin:0}}>
                                            <a href="https://www.investopedia.com/terms/c/capm.asp" target="_blank" rel="noopener noreferrer" style={{color:'var(--blue)',textDecoration:'none'}}>CAPM</a>{' · '}
                                            <a href="https://www.investopedia.com/terms/g/gordongrowthmodel.asp" target="_blank" rel="noopener noreferrer" style={{color:'var(--blue)',textDecoration:'none'}}>Gordon Growth Model</a>
                                        </p>
                                    </div>
                                )}
                            </div>

                            <p style={{textAlign:'center',color:'var(--text-dim)',fontSize:'0.7rem',fontStyle:'italic',lineHeight:1.65,margin:'2px 0 0'}}>
                                Theoretical models only. Not investment advice.<br/>
                                Actual prices may diverge due to market sentiment, corporate events, and macro factors.
                            </p>
                        </div>
                    );
                })()}

                {/* Footer */}
                <div style={{textAlign:'center',marginTop:'44px',paddingBottom:'8px'}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'7px',color:'var(--text-dim)',fontSize:'0.7rem',fontFamily:'var(--mono)'}}>
                        <span className="pulse-dot" style={{width:'5px',height:'5px',borderRadius:'50%',background:'var(--bull)',display:'inline-block',boxShadow:'0 0 6px var(--bull)'}}/>
                        CAPM · Gordon DDM · Earnings Yield Terminal
                    </div>
                </div>

            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CAPMGordonCalculator/>);
</script>
</body>
</html>
