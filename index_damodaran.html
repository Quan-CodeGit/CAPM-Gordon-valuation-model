<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CAPM Calculator - Damodaran Method</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Config: loaded when served by Flask (sets window.CONFIG.BACKEND_URL) -->
    <script src="/config.js" onerror="window.CONFIG=window.CONFIG||{}"></script>

    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
        .industry-dropdown { max-height: 220px; overflow-y: auto; }
        .industry-option:hover { background-color: #f3e8ff; cursor: pointer; }
        .industry-option.selected { background-color: #ede9fe; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ── icons ────────────────────────────────────────────────────────────
        const TrendingUp  = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
        );
        const Info = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" strokeWidth={2} />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 16v-4m0-4h.01" />
            </svg>
        );
        const AlertCircle = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" strokeWidth={2} />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01" />
            </svg>
        );
        const ChevronDown = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
            </svg>
        );
        const ExternalLink = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2}
                    d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4
                       M14 4h6m0 0v6m0-6L10 14" />
            </svg>
        );

        // ── main component ───────────────────────────────────────────────────
        function CAPMDamodaranCalculator() {
            // resolve backend URL once
            const API_URL = (window.CONFIG && window.CONFIG.BACKEND_URL)
                ? window.CONFIG.BACKEND_URL
                : 'http://localhost:5001';

            // existing state
            const [ticker,  setTicker]  = useState('');
            const [market,  setMarket]  = useState('VN');
            const [loading, setLoading] = useState(false);
            const [result,  setResult]  = useState(null);
            const [error,   setError]   = useState('');

            // industry / growth state
            const [industries,       setIndustries]       = useState([]);
            const [selectedIndustry, setSelectedIndustry] = useState('');
            const [industrySearch,   setIndustrySearch]   = useState('');
            const [showDropdown,     setShowDropdown]      = useState(false);
            const [calculatedGrowth, setCalculatedGrowth] = useState(null); // decimal
            const [growthNote,       setGrowthNote]        = useState(null);
            const [growthCapped,     setGrowthCapped]      = useState(false);
            const [overrideEnabled,  setOverrideEnabled]   = useState(false);
            const [manualGrowth,     setManualGrowth]      = useState('');
            const [loadingGrowth,    setLoadingGrowth]     = useState(false);
            const [dbStatus,         setDbStatus]          = useState(null);

            const dropdownRef = useRef(null);

            // close dropdown on outside click
            useEffect(() => {
                const handler = e => {
                    if (dropdownRef.current && !dropdownRef.current.contains(e.target))
                        setShowDropdown(false);
                };
                document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, []);

            // fetch industries on mount
            useEffect(() => { fetchIndustries(); }, []);

            // recalculate growth when industry or market changes
            useEffect(() => {
                if (selectedIndustry) fetchGrowthRate(selectedIndustry, market);
            }, [selectedIndustry, market]);

            const fetchIndustries = async () => {
                try {
                    const res  = await fetch(`${API_URL}/api/industries`);
                    const data = await res.json();
                    setIndustries(data.industries || []);
                    setDbStatus({
                        sourceYear:  data.source_year,
                        lastUpdated: data.last_updated,
                        sourceUrl:   data.source_url,
                    });
                } catch (e) {
                    console.warn('Could not load industries:', e);
                }
            };

            const fetchGrowthRate = async (industry, mkt) => {
                setLoadingGrowth(true);
                try {
                    const currency = mkt === 'VN' ? 'VND' : mkt === 'AU' ? 'AUD' : 'USD';
                    const res  = await fetch(
                        `${API_URL}/api/growth-rate?industry=${encodeURIComponent(industry)}&currency=${currency}`
                    );
                    const data = await res.json();
                    setCalculatedGrowth(data.g);
                    setGrowthNote(data.note || null);
                    setGrowthCapped(data.capped || false);
                    // pre-fill manual input only when user hasn't typed yet
                    if (!overrideEnabled) {
                        setManualGrowth((data.g * 100).toFixed(2));
                    }
                } catch (e) {
                    console.warn('Could not fetch growth rate:', e);
                } finally {
                    setLoadingGrowth(false);
                }
            };

            const filteredIndustries = industries.filter(i =>
                i.industry_name.toLowerCase().includes(industrySearch.toLowerCase())
            );

            const handleIndustrySelect = name => {
                setSelectedIndustry(name);
                setIndustrySearch('');
                setShowDropdown(false);
                setOverrideEnabled(false);
            };

            const handleOverrideToggle = checked => {
                setOverrideEnabled(checked);
                if (checked && calculatedGrowth !== null) {
                    setManualGrowth((calculatedGrowth * 100).toFixed(2));
                }
            };

            // ── valuation call ───────────────────────────────────────────────
            const calculateValuation = async () => {
                if (!ticker.trim()) { setError('Please enter a stock ticker'); return; }
                setLoading(true);
                setError('');
                setResult(null);
                try {
                    let url = `${API_URL}/api/valuation/${ticker.toUpperCase()}?market=${market}`;

                    if (overrideEnabled && manualGrowth) {
                        const g = parseFloat(manualGrowth) / 100;
                        if (!isNaN(g) && g >= 0 && g <= 0.20)
                            url += `&growth_override=${g}`;
                    } else if (selectedIndustry) {
                        url += `&industry=${encodeURIComponent(selectedIndustry)}`;
                    }

                    const response = await fetch(url);
                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.error || `API error: ${response.status}`);
                    }
                    const data = await response.json();
                    if (!data.ticker || !data.companyName)
                        throw new Error('Invalid stock data received.');
                    setResult(data);
                } catch (err) {
                    setError(err.message.includes('Failed to fetch')
                        ? 'Cannot connect to backend. Make sure backend_damodaran.py is running on port 5001'
                        : err.message);
                } finally {
                    setLoading(false);
                }
            };

            // ── formatting helpers ───────────────────────────────────────────
            const formatCurrency = (amount, currency) => {
                if (currency === 'VND')
                    return new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 })
                        .format(Math.round(amount)) + ' VND';
                if (currency === 'AUD')
                    return 'A$' + new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
                return '$' + new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
            };

            // ── render ───────────────────────────────────────────────────────
            return (
                <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-purple-100 p-4 md:p-6">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white rounded-2xl shadow-xl p-6 md:p-8">

                            {/* ── Header ── */}
                            <div className="flex items-center gap-3 mb-6">
                                <TrendingUp className="w-8 h-8 text-purple-600 flex-shrink-0" />
                                <div>
                                    <h1 className="text-2xl md:text-3xl font-bold text-gray-800">CAPM &amp; Gordon Model Valuation</h1>
                                    <span className="inline-block mt-1 text-xs bg-purple-600 text-white px-3 py-1 rounded-full font-semibold">
                                        Damodaran Method
                                    </span>
                                </div>
                            </div>

                            {/* ── Methodology info ── */}
                            <div className="bg-purple-50 rounded-lg p-4 mb-6 border border-purple-200">
                                <div className="flex gap-3">
                                    <Info className="w-5 h-5 text-purple-600 flex-shrink-0 mt-0.5" />
                                    <div className="text-sm text-gray-700">
                                        <p className="font-semibold mb-2 text-purple-800">Damodaran Country Risk Premium Method</p>
                                        <p className="mb-1"><span className="font-semibold">CAPM:</span> E(R) = Rf + Beta × Total ERP</p>
                                        <p className="mb-2 text-xs">Where Total ERP = Mature Market ERP (4.23%) + Country Risk Premium</p>
                                        <div className="bg-white rounded p-2 mt-2 text-xs">
                                            <p className="font-semibold mb-1">Country Risk Premiums (Jan 2026):</p>
                                            <div className="grid grid-cols-3 gap-2">
                                                <div><span className="font-medium">Vietnam (Ba2):</span> 8.13%</div>
                                                <div><span className="font-medium">Australia (Aaa):</span> 4.23%</div>
                                                <div><span className="font-medium">US (Aa1):</span> 4.46%</div>
                                            </div>
                                        </div>
                                        <p className="text-xs mt-2 text-purple-600">Source: Prof. Aswath Damodaran, NYU Stern</p>
                                    </div>
                                </div>
                            </div>

                            {/* ── Market selector ── */}
                            <div className="mb-6">
                                <label className="block text-sm font-medium text-gray-700 mb-2">Select Market</label>
                                <div className="flex gap-3 flex-wrap">
                                    {['VN', 'US', 'AU'].map(m => (
                                        <button key={m} onClick={() => setMarket(m)} disabled={loading}
                                            className={`px-5 py-2.5 rounded-lg border-2 font-semibold transition-all text-sm
                                                ${market === m
                                                    ? 'bg-purple-600 text-white border-purple-600 shadow-lg'
                                                    : 'bg-white text-gray-700 border-gray-300 hover:border-purple-600'}`}>
                                            {m === 'VN' ? '🇻🇳 Vietnam' : m === 'US' ? '🇺🇸 United States' : '🇦🇺 Australia'}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* ══════════════════════════════════════════════════════
                                INDUSTRY SELECTOR + GROWTH RATE SECTION
                            ══════════════════════════════════════════════════════ */}
                            <div className="mb-6 bg-indigo-50 rounded-xl p-5 border border-indigo-200">
                                <label className="block text-sm font-semibold text-gray-700 mb-1">
                                    Industry
                                    <span className="ml-2 text-xs font-normal text-gray-500">(optional — determines growth rate)</span>
                                </label>

                                {/* Searchable dropdown */}
                                <div ref={dropdownRef} className="relative mb-3">
                                    <div className="relative">
                                        <input
                                            type="text"
                                            value={showDropdown ? industrySearch : selectedIndustry}
                                            onChange={e => { setIndustrySearch(e.target.value); setShowDropdown(true); }}
                                            onFocus={() => setShowDropdown(true)}
                                            placeholder={industries.length === 0
                                                ? 'Loading industries…'
                                                : 'Search and select an industry…'}
                                            disabled={loading || industries.length === 0}
                                            className="w-full px-4 py-3 pr-10 border-2 border-gray-300 rounded-lg
                                                       focus:border-purple-500 focus:outline-none text-sm"
                                        />
                                        <ChevronDown className="absolute right-3 top-3.5 w-4 h-4 text-gray-400 pointer-events-none" />
                                    </div>

                                    {showDropdown && filteredIndustries.length > 0 && (
                                        <div className="industry-dropdown absolute z-50 w-full mt-1 bg-white border
                                                        border-gray-200 rounded-lg shadow-xl">
                                            {filteredIndustries.map(i => (
                                                <div key={i.industry_name}
                                                    className={`industry-option px-4 py-2.5 text-sm border-b border-gray-100 last:border-0
                                                                ${i.industry_name === selectedIndustry ? 'selected' : ''}`}
                                                    onMouseDown={() => handleIndustrySelect(i.industry_name)}>
                                                    <span className="font-medium">{i.industry_name}</span>
                                                    {i.eps_growth_next5yr !== null && (
                                                        <span className="ml-2 text-xs text-gray-400">
                                                            EPS +{i.eps_growth_next5yr.toFixed(1)}%
                                                        </span>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {showDropdown && industrySearch && filteredIndustries.length === 0 && (
                                        <div className="absolute z-50 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-xl p-4 text-sm text-gray-500">
                                            No industries match "{industrySearch}"
                                        </div>
                                    )}
                                </div>

                                {/* Growth rate display — only shown after industry selected */}
                                {selectedIndustry && (
                                    <div>
                                        {/* Growth rate field */}
                                        <div className="flex items-start gap-4 mb-3">
                                            <div className="flex-1">
                                                <label className="block text-xs font-medium text-gray-600 mb-1">
                                                    Industry-adjusted growth rate (g)
                                                </label>
                                                <div className="flex items-center gap-2">
                                                    {loadingGrowth ? (
                                                        <div className="flex items-center gap-2 px-4 py-3 bg-gray-100 rounded-lg w-full text-sm text-gray-500">
                                                            <svg className="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
                                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
                                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
                                                            </svg>
                                                            Calculating…
                                                        </div>
                                                    ) : (
                                                        <div className="relative flex-1">
                                                            <input
                                                                type="number"
                                                                step="0.01"
                                                                min="0"
                                                                max="20"
                                                                value={overrideEnabled
                                                                    ? manualGrowth
                                                                    : (calculatedGrowth !== null ? (calculatedGrowth * 100).toFixed(2) : '')}
                                                                readOnly={!overrideEnabled}
                                                                onChange={e => setManualGrowth(e.target.value)}
                                                                className={`w-full px-4 py-3 border-2 rounded-lg text-lg font-bold
                                                                    ${overrideEnabled
                                                                        ? 'border-amber-400 text-amber-700 bg-amber-50 focus:outline-none focus:border-amber-500'
                                                                        : 'border-purple-300 text-purple-700 bg-purple-50 cursor-default'}`}
                                                            />
                                                            <span className={`absolute right-4 top-3.5 text-lg font-bold
                                                                ${overrideEnabled ? 'text-amber-500' : 'text-purple-500'}`}>%</span>
                                                        </div>
                                                    )}
                                                </div>
                                                {!loadingGrowth && calculatedGrowth !== null && (
                                                    <p className="text-xs text-gray-500 mt-1">
                                                        {overrideEnabled
                                                            ? `Damodaran default: ${(calculatedGrowth * 100).toFixed(2)}%`
                                                            : `Industry-adjusted perpetuity growth (Damodaran ${dbStatus?.sourceYear || '2026'})`}
                                                    </p>
                                                )}
                                            </div>
                                        </div>

                                        {/* Subtitle / source label */}
                                        {!loadingGrowth && calculatedGrowth !== null && !overrideEnabled && (
                                            <p className="text-xs text-indigo-600 font-medium mb-2">
                                                Based on Damodaran {dbStatus?.sourceYear || '2026'} — {selectedIndustry}
                                            </p>
                                        )}

                                        {/* Notes from calculation engine */}
                                        {growthNote && (
                                            <div className="flex items-start gap-2 bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 mb-2 text-xs text-blue-700">
                                                <span className="mt-0.5">ℹ️</span>
                                                <span>{growthNote}</span>
                                            </div>
                                        )}
                                        {growthCapped && !growthNote?.includes('capped') && (
                                            <div className="flex items-start gap-2 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mb-2 text-xs text-amber-700">
                                                <span className="mt-0.5">⚠️</span>
                                                <span>Industry growth capped at 5% perpetuity ceiling</span>
                                            </div>
                                        )}

                                        {/* Override toggle */}
                                        <label className="flex items-center gap-2 cursor-pointer mb-2 text-sm text-gray-700 select-none">
                                            <input
                                                type="checkbox"
                                                checked={overrideEnabled}
                                                onChange={e => handleOverrideToggle(e.target.checked)}
                                                className="w-4 h-4 accent-amber-500"
                                            />
                                            Override growth rate manually
                                        </label>
                                        {overrideEnabled && calculatedGrowth !== null && (
                                            <div className="text-xs text-amber-600 bg-amber-50 border border-amber-200 rounded px-3 py-1.5 mb-2">
                                                ⚠️ Manual override active — Damodaran default is {(calculatedGrowth * 100).toFixed(2)}%
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Data freshness indicator */}
                                {dbStatus && (
                                    <div className="flex items-center gap-1.5 text-xs text-gray-400 mt-2 flex-wrap">
                                        <span>Data: Damodaran {dbStatus.sourceYear}</span>
                                        <span>·</span>
                                        <span>Last updated {dbStatus.lastUpdated}</span>
                                        <span>·</span>
                                        <a href={dbStatus.sourceUrl} target="_blank" rel="noopener noreferrer"
                                           className="inline-flex items-center gap-0.5 text-indigo-500 hover:text-indigo-700 transition-colors">
                                            Source <ExternalLink className="w-3 h-3" />
                                        </a>
                                    </div>
                                )}
                            </div>
                            {/* ══ end industry section ══ */}

                            {/* ── Ticker input ── */}
                            <div className="mb-8">
                                <label className="block text-sm font-medium text-gray-700 mb-2">Stock Ticker Symbol</label>
                                <div className="flex gap-3 flex-wrap">
                                    <input
                                        type="text"
                                        value={ticker}
                                        onChange={e => setTicker(e.target.value.toUpperCase())}
                                        onKeyPress={e => e.key === 'Enter' && calculateValuation()}
                                        placeholder="e.g., VNM, AAPL, CBA"
                                        className="flex-1 min-w-[140px] px-4 py-3 border-2 border-gray-300 rounded-lg
                                                   focus:border-purple-500 focus:outline-none text-lg font-semibold uppercase"
                                        disabled={loading}
                                    />
                                    <button onClick={calculateValuation} disabled={loading}
                                        className="px-8 py-3 bg-purple-600 text-white rounded-lg font-semibold
                                                   hover:bg-purple-700 disabled:bg-gray-400 transition-colors whitespace-nowrap">
                                        {loading ? 'Analyzing…' : 'Analyze'}
                                    </button>
                                </div>
                            </div>

                            {/* ── Error ── */}
                            {error && (
                                <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                                    <p className="text-red-700 text-sm">{error}</p>
                                </div>
                            )}

                            {/* ══════════════════════════════════════════════════════
                                RESULTS
                            ══════════════════════════════════════════════════════ */}
                            {result && (
                                <div className="space-y-6">

                                    {/* Valuation verdict */}
                                    <div className={`rounded-xl p-6 text-white ${
                                        result.valuation === 'UNDERVALUED'
                                            ? 'bg-gradient-to-r from-green-600 to-emerald-600'
                                            : 'bg-gradient-to-r from-red-600 to-rose-600'
                                    }`}>
                                        <h2 className="text-lg font-medium mb-2">{result.companyName}</h2>
                                        <div className="flex items-center gap-3">
                                            <AlertCircle className="w-8 h-8 flex-shrink-0" />
                                            <div>
                                                <p className="text-3xl font-bold">{result.valuation}</p>
                                                <p className="text-sm opacity-90">
                                                    {result.valuation === 'UNDERVALUED'
                                                        ? 'Current price < Fair price — Expected to RISE'
                                                        : 'Current price > Fair price — Expected to FALL'}
                                                </p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* CAPM + Gordon side by side */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                                        {/* CAPM */}
                                        <div className="bg-purple-50 rounded-lg p-5 border-2 border-purple-200">
                                            <h3 className="font-semibold text-gray-800 mb-3">
                                                CAPM Analysis
                                                <span className="ml-2 text-xs bg-purple-600 text-white px-2 py-0.5 rounded">Damodaran</span>
                                            </h3>
                                            <div className="space-y-2">
                                                <div className="flex justify-between">
                                                    <span className="text-gray-600">Required Return:</span>
                                                    <span className="font-bold text-purple-700">{(result.capmReturn * 100).toFixed(2)}%</span>
                                                </div>
                                                <div className="text-sm text-gray-600 mt-3">
                                                    <p className="font-medium">Formula: Rf + Beta × Total ERP</p>
                                                    <p className="mt-1">= {(result.riskFreeRate * 100).toFixed(2)}% + {result.beta.toFixed(2)} × {(result.totalErp * 100).toFixed(2)}%</p>
                                                    <p className="mt-1">= {(result.riskFreeRate * 100).toFixed(2)}% + {(result.beta * result.totalErp * 100).toFixed(2)}%</p>
                                                    <p className="mt-1 font-semibold">= {(result.capmReturn * 100).toFixed(2)}%</p>
                                                </div>
                                                <div className="mt-3 pt-3 border-t border-purple-200 text-xs">
                                                    <p><span className="font-medium">Sovereign Rating:</span> {result.sovereignRating}</p>
                                                    <p><span className="font-medium">Country Risk Premium:</span> {(result.countryRiskPremium * 100).toFixed(2)}%</p>
                                                    <p><span className="font-medium">Total ERP:</span> {(result.totalErp * 100).toFixed(2)}%</p>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Gordon */}
                                        <div className="bg-blue-50 rounded-lg p-5 border-2 border-blue-200">
                                            <h3 className="font-semibold text-gray-800 mb-3">Gordon Model Analysis</h3>
                                            <div className="space-y-2">
                                                <div className="flex justify-between">
                                                    <span className="text-gray-600">Expected Return:</span>
                                                    <span className="font-bold text-blue-700">{(result.gordonReturn * 100).toFixed(2)}%</span>
                                                </div>
                                                <div className="text-sm text-gray-600 mt-3">
                                                    <p>Formula: (D₁/P₀) + g</p>
                                                    <p className="mt-1">
                                                        = ({formatCurrency(result.dividendD1, result.currency)} / {formatCurrency(result.currentPrice, result.currency)}) + {(result.dividendGrowth * 100).toFixed(2)}%
                                                    </p>
                                                </div>
                                                {/* Growth source label */}
                                                <div className="mt-3 pt-3 border-t border-blue-200 text-xs">
                                                    <p>
                                                        <span className="font-medium">Growth rate (g):</span>{' '}
                                                        <span className="text-blue-700 font-semibold">{(result.dividendGrowth * 100).toFixed(2)}%</span>
                                                    </p>
                                                    {result.growthSource && (
                                                        <p className="text-gray-500 mt-0.5">{result.growthSource}</p>
                                                    )}
                                                    {result.growthWarning && (
                                                        <p className="text-amber-600 mt-1">⚠️ {result.growthWarning}</p>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Valuation summary */}
                                    <div className="bg-gray-50 rounded-lg p-5">
                                        <h3 className="font-semibold text-gray-800 mb-3">Valuation Summary</h3>
                                        <div className="grid grid-cols-3 gap-4">
                                            <div>
                                                <p className="text-sm text-gray-600">Current Price</p>
                                                <p className="text-2xl font-bold">{formatCurrency(result.currentPrice, result.currency)}</p>
                                            </div>
                                            <div>
                                                <p className="text-sm text-gray-600">Fair Price</p>
                                                <p className="text-2xl font-bold">{formatCurrency(result.fairPrice, result.currency)}</p>
                                            </div>
                                            <div>
                                                <p className="text-sm text-gray-600">Difference</p>
                                                <p className={`text-2xl font-bold ${result.priceDifference > 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                    {result.priceDifference > 0 ? '+' : ''}{result.priceDifference.toFixed(2)}%
                                                </p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Key metrics */}
                                    <div className="bg-gray-50 rounded-lg p-5">
                                        <h3 className="font-semibold text-gray-800 mb-3">Key Metrics</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                            <div>
                                                <p className="text-xs text-gray-600">Beta</p>
                                                <p className="text-lg font-bold">{result.beta.toFixed(3)}</p>
                                            </div>
                                            <div>
                                                <p className="text-xs text-gray-600">Risk-Free Rate</p>
                                                <p className="text-lg font-bold">{(result.riskFreeRate * 100).toFixed(2)}%</p>
                                            </div>
                                            <div>
                                                <p className="text-xs text-gray-600">Total ERP ({result.sovereignRating})</p>
                                                <p className="text-lg font-bold text-purple-600">{(result.totalErp * 100).toFixed(2)}%</p>
                                            </div>
                                            <div>
                                                <p className="text-xs text-gray-600">Annual Dividend</p>
                                                <p className="text-lg font-bold">{formatCurrency(result.dividend, result.currency)}</p>
                                            </div>
                                            <div>
                                                <p className="text-xs text-gray-600">Growth Rate (g)</p>
                                                <p className={`text-lg font-bold ${result.industryName ? 'text-indigo-600' : ''}`}>
                                                    {(result.dividendGrowth * 100).toFixed(2)}%
                                                </p>
                                                {result.industryName && (
                                                    <p className="text-xs text-indigo-500">Industry-adj.</p>
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    {/* ── Growth Rate Breakdown ── */}
                                    <div className="bg-indigo-50 rounded-lg p-5 border border-indigo-200">
                                        <h3 className="font-semibold text-gray-800 mb-4">Growth Rate (g) Breakdown</h3>

                                        {result.growthDetails ? (
                                            result.growthDetails.method === 'industry' ? (
                                                /* Industry-adjusted path */
                                                <div className="space-y-3">
                                                    <div className="flex items-center gap-2 mb-3">
                                                        <span className="text-xs bg-indigo-600 text-white px-2 py-0.5 rounded font-semibold">
                                                            Industry-Adjusted
                                                        </span>
                                                        <span className="text-xs text-gray-500">
                                                            Damodaran {result.growthDetails.damodaranYear} — {result.industryName}
                                                        </span>
                                                    </div>

                                                    {/* Step-by-step formula */}
                                                    <div className="bg-white rounded-lg p-4 text-sm font-mono space-y-1.5 border border-indigo-100">
                                                        <p className="text-xs text-gray-400 font-sans mb-2 font-semibold">Formula: g = GDP_base × (Industry EPS / Benchmark EPS)</p>

                                                        <div className="flex justify-between">
                                                            <span className="text-gray-600">Industry EPS growth (5yr):</span>
                                                            <span className="font-bold text-gray-800">
                                                                {result.growthDetails.industryEpsGrowth !== null
                                                                    ? `${result.growthDetails.industryEpsGrowth.toFixed(2)}%`
                                                                    : <span className="text-amber-600">N/A (revenue proxy used)</span>}
                                                            </span>
                                                        </div>
                                                        <div className="flex justify-between">
                                                            <span className="text-gray-600">Benchmark (Total Market):</span>
                                                            <span className="font-bold text-gray-800">
                                                                {result.growthDetails.benchmarkEpsGrowth !== null
                                                                    ? `${result.growthDetails.benchmarkEpsGrowth.toFixed(2)}%`
                                                                    : '—'}
                                                            </span>
                                                        </div>
                                                        <div className="flex justify-between border-t border-gray-100 pt-1.5">
                                                            <span className="text-gray-600">Weight (Industry / Benchmark):</span>
                                                            <span className="font-bold text-indigo-700">
                                                                {result.growthDetails.weight !== null
                                                                    ? result.growthDetails.weight.toFixed(4)
                                                                    : '—'}
                                                            </span>
                                                        </div>
                                                        <div className="flex justify-between">
                                                            <span className="text-gray-600">GDP base ({result.currency}):</span>
                                                            <span className="font-bold text-gray-800">
                                                                {result.growthDetails.gdpBase !== null
                                                                    ? `${(result.growthDetails.gdpBase * 100).toFixed(1)}%`
                                                                    : '—'}
                                                            </span>
                                                        </div>
                                                        <div className="flex justify-between border-t-2 border-indigo-200 pt-2 mt-1">
                                                            <span className="font-semibold text-gray-700">
                                                                g = {result.growthDetails.gdpBase !== null ? `${(result.growthDetails.gdpBase * 100).toFixed(1)}%` : '?'}
                                                                {' × '}
                                                                {result.growthDetails.weight !== null ? result.growthDetails.weight.toFixed(4) : '?'}
                                                            </span>
                                                            <span className="font-bold text-indigo-700 text-base">
                                                                = {(result.dividendGrowth * 100).toFixed(2)}%
                                                                {result.growthDetails.capped && (
                                                                    <span className="ml-1 text-xs text-amber-600">(capped at 5%)</span>
                                                                )}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    {result.growthWarning && (
                                                        <div className="flex items-start gap-2 text-xs text-blue-700 bg-blue-50 border border-blue-100 rounded px-3 py-2">
                                                            <span>ℹ️</span><span>{result.growthWarning}</span>
                                                        </div>
                                                    )}
                                                </div>
                                            ) : (
                                                /* Manual override path */
                                                <div className="space-y-3">
                                                    <div className="flex items-center gap-2 mb-2">
                                                        <span className="text-xs bg-amber-500 text-white px-2 py-0.5 rounded font-semibold">
                                                            Manual Override
                                                        </span>
                                                    </div>
                                                    <div className="bg-white rounded-lg p-4 text-sm border border-amber-100">
                                                        <div className="flex justify-between">
                                                            <span className="text-gray-600">User-defined growth rate:</span>
                                                            <span className="font-bold text-amber-700 text-base">{(result.dividendGrowth * 100).toFixed(2)}%</span>
                                                        </div>
                                                        {result.growthWarning && (
                                                            <p className="text-xs text-gray-500 mt-2">Note: {result.growthWarning}</p>
                                                        )}
                                                    </div>
                                                </div>
                                            )
                                        ) : (
                                            /* Historical / fallback path */
                                            <div className="space-y-3">
                                                <div className="flex items-center gap-2 mb-2">
                                                    <span className="text-xs bg-gray-500 text-white px-2 py-0.5 rounded font-semibold">
                                                        Historical
                                                    </span>
                                                </div>
                                                <div className="bg-white rounded-lg p-4 text-sm border border-gray-100 space-y-1.5">
                                                    <div className="flex justify-between">
                                                        <span className="text-gray-600">Method:</span>
                                                        <span className="font-medium text-gray-800">Historical dividend CAGR</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span className="text-gray-600">Growth rate applied:</span>
                                                        <span className="font-bold text-gray-800">{(result.dividendGrowth * 100).toFixed(2)}%</span>
                                                    </div>
                                                    {result.historicalDividendGrowth && result.historicalDividendGrowth !== result.dividendGrowth && (
                                                        <div className="flex justify-between text-xs text-amber-600 pt-1 border-t border-gray-100">
                                                            <span>Historical rate (before cap):</span>
                                                            <span>{(result.historicalDividendGrowth * 100).toFixed(2)}%</span>
                                                        </div>
                                                    )}
                                                    {result.growthWarning && (
                                                        <p className="text-xs text-amber-600 pt-1 border-t border-gray-100">⚠️ {result.growthWarning}</p>
                                                    )}
                                                    <p className="text-xs text-gray-400 pt-1">
                                                        Tip: Select an industry above to use Damodaran industry-adjusted growth.
                                                    </p>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Interpretation */}
                                    <div className="bg-amber-50 rounded-lg p-5 border border-amber-200">
                                        <h3 className="font-semibold text-gray-800 mb-2">Interpretation</h3>
                                        <p className="text-sm text-gray-700">
                                            {result.valuation === 'UNDERVALUED' ? (
                                                <>Gordon Expected Return ({(result.gordonReturn * 100).toFixed(2)}%) &gt; CAPM Required Return ({(result.capmReturn * 100).toFixed(2)}%). Stock is <span className="font-bold text-green-700">undervalued</span> — price expected to rise.</>
                                            ) : (
                                                <>Gordon Expected Return ({(result.gordonReturn * 100).toFixed(2)}%) &lt; CAPM Required Return ({(result.capmReturn * 100).toFixed(2)}%). Stock is <span className="font-bold text-red-700">overvalued</span> — price expected to fall.</>
                                            )}
                                        </p>
                                        {result.lowDividendWarning && (
                                            <p className="text-xs text-amber-700 mt-2">⚠️ {result.lowDividendWarning}</p>
                                        )}
                                    </div>

                                    {/* Data source footer */}
                                    <div className="text-xs text-gray-400 text-center space-y-1">
                                        <p>Methodology: Damodaran Country Risk Premium (NYU Stern, January 2026)</p>
                                        {result.industryName && (
                                            <p>Growth rate: {result.growthSource}</p>
                                        )}
                                        <p>This is not investment advice.</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CAPMDamodaranCalculator />);
    </script>
</body>
</html>
